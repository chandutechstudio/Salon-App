<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon App - Booking Successful</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-indigo-600 to-purple-800 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <div class="bg-white w-full max-w-sm p-8 rounded-3xl shadow-2xl text-center space-y-6">
        <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-4xl shadow-inner animate-bounce">
            <i class="fa-solid fa-check"></i>
        </div>

        <div class="space-y-1">
            <h2 class="text-xl font-bold text-gray-900">Booking Submitted!</h2>
            <p class="text-xs text-gray-500">Your appointment has been saved in cloud and synced with salon admin.</p>
        </div>

        <div class="bg-gray-50 border border-gray-100 p-4 rounded-2xl text-left space-y-2 text-xs">
            <div class="flex justify-between border-b pb-1.5">
                <span class="text-gray-400">Service:</span>
                <span id="successService" class="font-bold text-gray-800">Loading...</span>
            </div>
            <div class="flex justify-between border-b pb-1.5">
                <span class="text-gray-400">Date & Time:</span>
                <span id="successTime" class="font-semibold text-indigo-600">Loading...</span>
            </div>
            <div class="flex justify-between border-b pb-1.5">
                <span class="text-gray-400">Payment Mode:</span>
                <span id="successMode" class="font-semibold text-gray-700">Loading...</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-400">Status:</span>
                <span id="successStatus" class="font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded">Pending</span>
            </div>
        </div>

        <div class="space-y-2">
            <a id="viewStatusBtn" href="status.html" class="block w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-xs text-center">View Booking Status</a>
            <a id="backHomeBtn" href="home.html" class="block w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition text-xs text-center">Back to Home</a>
        </div>
    </div>

    <script type="module">
        import { getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { resolveActiveSalonId, buildSalonUrl, getSalonSubcollectionRef } from "./tenant.js";

        const app = getApps()[0];
        const auth = getAuth(app);
        const activeSalonId = resolveActiveSalonId({ persist: true });

        document.getElementById("viewStatusBtn").setAttribute("href", buildSalonUrl("status.html", activeSalonId));
        document.getElementById("backHomeBtn").setAttribute("href", buildSalonUrl("home.html", activeSalonId));

        onAuthStateChanged(auth, async (user) => {
            if (!activeSalonId) return;
            try {
                const snap = await getDocs(getSalonSubcollectionRef(activeSalonId, "bookings"));
                const items = [];
                snap.forEach((docSnap) => {
                    const b = docSnap.data();
                    const email = String(user?.email || "").trim().toLowerCase();
                    const bPhone = String(b.userPhone || b.phone || "").trim().toLowerCase();
                    if (!email || bPhone === email) {
                        items.push(b);
                    }
                });

                items.sort((a, b) => {
                    const ta = a.timestamp?.toMillis ? a.timestamp.toMillis() : 0;
                    const tb = b.timestamp?.toMillis ? b.timestamp.toMillis() : 0;
                    return ta - tb;
                });

                const latest = items[items.length - 1];
                if (latest) {
                    document.getElementById("successService").innerText = latest.service || "Salon Service";
                    document.getElementById("successTime").innerText = String(latest.time || "").replace("T", " ") || "Not specified";
                    document.getElementById("successMode").innerText = `${latest.paymentType || "UPI"} (UTR: ${latest.utr || "N/A"})`;
                    document.getElementById("successStatus").innerText = latest.status || "Pending";
                }
            } catch (err) {
                console.error("Error loading latest booking:", err);
            }
        });
    </script>
</body>
</html>
