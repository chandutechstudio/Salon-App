<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon App - Login / Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>.hide { display: none !important; }</style>

    <script>
        function switchAuthView(view) {
            const loginF = document.getElementById("loginForm");
            const regF = document.getElementById("registerForm");
            const title = document.getElementById("screenTitle");
            const subtitle = document.getElementById("screenSubtitle");
            const errorBox = document.getElementById("authError");

            if (loginF) loginF.classList.add("hide");
            if (regF) regF.classList.add("hide");
            if (errorBox) errorBox.classList.add("hide");

            if (view === "register") {
                if (regF) regF.classList.remove("hide");
                if (title) title.innerText = "Create Account";
                if (subtitle) subtitle.innerText = "Sign up for new booking experience";
            } else {
                if (loginF) loginF.classList.remove("hide");
                if (title) title.innerText = "Welcome Back";
                if (subtitle) subtitle.innerText = "Login to your user account";
            }
        }

        function showAuthError(msg) {
            const errorBox = document.getElementById("authError");
            if (!errorBox) return;
            errorBox.innerText = msg;
            errorBox.classList.remove("hide");
        }
    </script>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBR7QQNVmKmlAem6FRfqbMYVuK0tdwhb6I",
            authDomain: "creator-chandu.firebaseapp.com",
            projectId: "creator-chandu",
            storageBucket: "creator-chandu.firebasestorage.app",
            messagingSenderId: "536504537561",
            appId: "1:536504537561:web:3c7d0362376f63462649c8",
            measurementId: "G-7RLH5MVLV3"
        };

        const DEFAULT_SALON_SLUG = "style-hub";
        const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isRedirecting = false;

        function normalizeSlug(val) {
            return String(val || "").trim().toLowerCase();
        }

        function getInitialSlug() {
            const params = new URLSearchParams(window.location.search);
            const fromUrl = normalizeSlug(params.get("salon"));
            if (fromUrl) {
                try { sessionStorage.setItem("activeSalonId", fromUrl); } catch (_) {}
                return fromUrl;
            }
            try {
                const fromSession = normalizeSlug(sessionStorage.getItem("activeSalonId"));
                if (fromSession) return fromSession;
            } catch (_) {}
            return DEFAULT_SALON_SLUG;
        }

        async function resolveSlug(baseSlug) {
            let current = normalizeSlug(baseSlug) || DEFAULT_SALON_SLUG;
            const visited = new Set();
            while (current && !visited.has(current)) {
                visited.add(current);
                try {
                    const snap = await Promise.race([
                        getDoc(doc(db, "salons", current)),
                        new Promise((resolve) => setTimeout(() => resolve(null), 1500))
                    ]);
                    if (!snap || !snap.exists()) break;
                    const next = normalizeSlug(snap.data()?.redirectToSlug || "");
                    if (next && next !== current) {
                        current = next;
                    } else {
                        break;
                    }
                } catch (_) {
                    break;
                }
            }
            try { sessionStorage.setItem("activeSalonId", current); } catch (_) {}
            return current;
        }

        function buildHomeUrl(salonSlug) {
            const cleanSlug = normalizeSlug(salonSlug) || DEFAULT_SALON_SLUG;
            const params = new URLSearchParams(window.location.search);
            const rawNext = (params.get("next") || "").trim();
            const safePages = ["home.html", "booking.html", "payment.html", "category.html", "status.html", "history.html", "profile.html", "success.html"];
            const targetPage = safePages.includes(rawNext) ? rawNext : "home.html";
            const url = new URL(targetPage, window.location.href);
            url.searchParams.set("salon", cleanSlug);
            return url.toString();
        }

        async function syncCustomer(user, name, email, salonSlug) {
            if (!user || !salonSlug) return;
            try {
                await Promise.race([
                    setDoc(
                        doc(db, "salons", salonSlug, "customers", user.uid),
                        {
                            uid: user.uid,
                            name: name || user.displayName || email.split("@")[0],
                            email: email.toLowerCase(),
                            salonId: salonSlug,
                            updatedAt: serverTimestamp()
                        },
                        { merge: true }
                    ),
                    new Promise((resolve) => setTimeout(resolve, 1500))
                ]);
            } catch (_) {}
        }

        async function goToHome(user, slug) {
            if (isRedirecting) return;
            isRedirecting = true;
            const finalSlug = await resolveSlug(slug || getInitialSlug());
            const displayName = user.displayName || (user.email ? user.email.split("@")[0] : "Customer");
            try {
                sessionStorage.setItem("salonCustomerName", displayName);
                if (user.email) sessionStorage.setItem("salonCustomerEmail", user.email.trim().toLowerCase());
                sessionStorage.setItem("activeSalonId", finalSlug);
            } catch (_) {}
            window.location.replace(buildHomeUrl(finalSlug));
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await goToHome(user, getInitialSlug());
            }
        });

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const origText = btn.innerHTML;
            document.getElementById("authError").classList.add("hide");

            const email = document.getElementById("loginEmail").value.trim().toLowerCase();
            const pass = document.getElementById("loginPass").value;

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Logging in...`;

            try {
                const slug = await resolveSlug(getInitialSlug());
                isRedirecting = true;
                const cred = await signInWithEmailAndPassword(auth, email, pass);
                const resolvedName = cred.user.displayName || email.split("@")[0];
                await syncCustomer(cred.user, resolvedName, email, slug);
                try {
                    sessionStorage.setItem("salonCustomerName", resolvedName);
                    sessionStorage.setItem("salonCustomerEmail", email);
                    sessionStorage.setItem("activeSalonId", slug);
                } catch (_) {}
                window.location.replace(buildHomeUrl(slug));
            } catch (err) {
                isRedirecting = false;
                btn.disabled = false;
                btn.innerHTML = origText;
                const code = err?.code || "";
                if (code === "auth/user-not-found" || code === "auth/invalid-credential" || code === "auth/invalid-email") {
                    showAuthError("⚠️ Is email se account nahi bana hai! Kripya pehle Register karein.");
                } else if (code === "auth/wrong-password") {
                    showAuthError("⚠️ Wrong Password! Password galat hai.");
                } else {
                    showAuthError("⚠️ Login Failed: " + (err?.message || "Please try again."));
                }
            }
        });

        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const origText = btn.innerHTML;
            document.getElementById("authError").classList.add("hide");

            const name = document.getElementById("regName").value.trim();
            const email = document.getElementById("regEmail").value.trim().toLowerCase();
            const pass = document.getElementById("regPass").value;

            if (pass.length < 6) {
                showAuthError("⚠️ Password kam se kam 6 characters ka hona chahiye!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Registering...`;

            try {
                const slug = await resolveSlug(getInitialSlug());
                isRedirecting = true;
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                if (name) {
                    await updateProfile(cred.user, { displayName: name }).catch(() => {});
                }
                const resolvedName = name || email.split("@")[0];
                await syncCustomer(cred.user, resolvedName, email, slug);
                try {
                    sessionStorage.setItem("salonCustomerName", resolvedName);
                    sessionStorage.setItem("salonCustomerEmail", email);
                    sessionStorage.setItem("activeSalonId", slug);
                } catch (_) {}
                window.location.replace(buildHomeUrl(slug));
            } catch (err) {
                isRedirecting = false;
                btn.disabled = false;
                btn.innerHTML = origText;
                const code = err?.code || "";
                if (code === "auth/email-already-in-use") {
                    showAuthError("⚠️ Already Account exists with this email! Kripya Login karein.");
                } else if (code === "auth/invalid-email") {
                    showAuthError("⚠️ Wrong Email ID format!");
                } else {
                    showAuthError("⚠️ Registration Failed: " + (err?.message || "Please try again."));
                }
            }
        });
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-600 to-purple-800 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-2xl space-y-6">
        <div class="text-center">
            <div class="bg-indigo-100 text-indigo-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold shadow-inner">
                <i class="fa-solid fa-scissors"></i>
            </div>
            <h2 id="screenTitle" class="text-2xl font-bold text-gray-900">Welcome Back</h2>
            <p id="screenSubtitle" class="text-xs text-gray-500 mt-1">Login to your user account</p>
        </div>

        <div id="authError" class="hide bg-red-50 border border-red-200 text-red-600 text-xs font-semibold p-3 rounded-xl text-center shadow-sm"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Email ID</label>
                <input type="email" id="loginEmail" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="user@gmail.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
                <input type="password" id="loginPass" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-sm cursor-pointer">Login</button>

            <p class="text-center text-xs text-gray-500 pt-2">
                Don't have an account? <button type="button" onclick="switchAuthView('register')" class="text-indigo-600 font-bold hover:underline cursor-pointer">Register</button>
            </p>
        </form>

        <form id="registerForm" class="hide space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Full Name</label>
                <input type="text" id="regName" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Chandu Agariya">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Email ID</label>
                <input type="email" id="regEmail" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="user@gmail.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Create Password (Min 6 chars)</label>
                <input type="password" id="regPass" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-sm cursor-pointer">Register Account</button>

            <p class="text-center text-xs text-gray-500 pt-2">
                Already have an account? <button type="button" onclick="switchAuthView('login')" class="text-indigo-600 font-bold hover:underline cursor-pointer">Login</button>
            </p>
        </form>
    </div>
</body>
</html>
