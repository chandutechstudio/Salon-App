<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon App - Login / Register</title>
    <link id="dynamicManifestLink" rel="manifest">
    <link id="dynamicIconLink" rel="icon" href="">
    <link id="dynamicAppleIconLink" rel="apple-touch-icon" href="">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>.hide { display: none !important; }</style>

    <script>
        window.__dismissSplashNow = function(immediate) {
            try {
                window.__splashDismissed = true;
                var splash = document.getElementById("salonSplashScreen");
                if (!splash) return;
                splash.style.pointerEvents = "none";
                splash.style.setProperty("display", "none", "important");
                if (splash.parentNode) splash.parentNode.removeChild(splash);
            } catch (_) {}
        };

        window.__showAuthError = function(msg) {
            var errorBox = document.getElementById("authError");
            if (!errorBox) return;
            errorBox.innerText = msg;
            errorBox.classList.remove("hide");
        };

        window.__clearAuthError = function() {
            var errorBox = document.getElementById("authError");
            if (!errorBox) return;
            errorBox.innerText = "";
            errorBox.classList.add("hide");
        };

        window.switchAuthView = function(view) {
            var loginF = document.getElementById("loginForm");
            var regF = document.getElementById("registerForm");
            var title = document.getElementById("screenTitle");
            var subtitle = document.getElementById("screenSubtitle");
            window.__clearAuthError();

            if (!loginF || !regF) return;

            if (view === "login") {
                loginF.classList.remove("hide");
                regF.classList.add("hide");
                if (title) title.innerText = "Welcome Back";
                if (subtitle) subtitle.innerText = "Login to your user account";
            } else if (view === "register") {
                regF.classList.remove("hide");
                loginF.classList.add("hide");
                if (title) title.innerText = "Create Account";
                if (subtitle) subtitle.innerText = "Sign up for new booking experience";
            }
        };

        document.addEventListener("DOMContentLoaded", function() {
            window.__dismissSplashNow(true);
        });

        setTimeout(function() {
            window.__dismissSplashNow(true);
        }, 600);

        window.addEventListener("error", function(ev) {
            window.__dismissSplashNow(true);
            if (ev && ev.message) {
                console.error("Page error:", ev.message);
            }
        });

        window.addEventListener("unhandledrejection", function(ev) {
            window.__dismissSplashNow(true);
            if (ev && ev.reason) {
                console.error("Unhandled rejection:", ev.reason);
            }
        });
    </script>

    <script type="module">
        import {
            onAuthStateChanged,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import {
            auth,
            DEFAULT_SALON_SLUG,
            resolveActiveSalonId,
            resolveCanonicalSalonId,
            buildSalonUrl,
            getSalonDocRef,
            getCustomerDocRef
        } from "./tenant.js";

        let activeSalonId = DEFAULT_SALON_SLUG;
        let isRedirecting = false;
        let deferredInstallPrompt = null;
        let pwaAppliedForSlug = "";

        function normalizeSlugSafe(slug) {
            return String(slug || "").trim().toLowerCase();
        }

        function withTimeout(promise, ms = 1000, fallbackValue = null) {
            return Promise.race([
                promise.catch(() => fallbackValue),
                new Promise((resolve) => setTimeout(() => resolve(fallbackValue), ms))
            ]);
        }

        try {
            activeSalonId = resolveActiveSalonId({ persist: true, fallback: DEFAULT_SALON_SLUG }) || DEFAULT_SALON_SLUG;
        } catch (_) {
            activeSalonId = DEFAULT_SALON_SLUG;
        }

        window.addEventListener("beforeinstallprompt", (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
            const banner = document.getElementById("installAppBanner");
            if (banner) banner.classList.remove("hide");
        });

        async function applyDynamicSalonPwa(salonSlug) {
            window.__dismissSplashNow(true);
            const targetSlug = normalizeSlugSafe(salonSlug);
            if (!targetSlug || pwaAppliedForSlug === targetSlug) return;
            pwaAppliedForSlug = targetSlug;

            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("./sw.js").catch(() => {});
            }

            let appName = "Salon App";
            let logoUrl = "";

            try {
                const snap = await withTimeout(getDoc(getSalonDocRef(targetSlug)), 1000, null);
                if (snap && snap.exists && snap.exists()) {
                    const data = snap.data() || {};
                    const pwa = data.pwaConfig || {};
                    appName = pwa.appName || data.salonName || appName;
                    logoUrl = pwa.logoUrl || "";
                }
            } catch (_) {}

            document.title = `${appName} - Login / Register`;

            const cardTitleEl = document.getElementById("brandAppTitle");
            if (cardTitleEl) cardTitleEl.innerText = appName;

            const cardLogoIcon = document.getElementById("brandLogoIcon");
            const cardLogoImg = document.getElementById("brandLogoImg");
            if (logoUrl && cardLogoImg) {
                cardLogoImg.src = logoUrl;
                cardLogoImg.classList.remove("hide");
                if (cardLogoIcon) cardLogoIcon.classList.add("hide");
            }

            const bannerName = document.getElementById("bannerAppName");
            const bannerIcon = document.getElementById("bannerAppIcon");
            if (bannerName) bannerName.textContent = `Install ${appName}`;
            if (logoUrl && bannerIcon) {
                bannerIcon.src = logoUrl;
                bannerIcon.classList.remove("hide");
            }

            if (logoUrl) {
                const iconLink = document.getElementById("dynamicIconLink");
                const appleIconLink = document.getElementById("dynamicAppleIconLink");
                if (iconLink) iconLink.href = logoUrl;
                if (appleIconLink) appleIconLink.href = logoUrl;
            }

            try {
                const startUrl = new URL(window.location.href);
                startUrl.searchParams.set("salon", targetSlug);

                const manifestObj = {
                    name: appName,
                    short_name: appName.slice(0, 12),
                    start_url: startUrl.pathname + startUrl.search,
                    scope: "./",
                    display: "standalone",
                    background_color: "#020617",
                    icons: logoUrl
                        ? [
                            { src: logoUrl, sizes: "192x192", type: "image/jpeg" },
                            { src: logoUrl, sizes: "512x512", type: "image/jpeg" }
                        ]
                        : []
                };

                const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: "application/manifest+json" });
                const manifestLink = document.getElementById("dynamicManifestLink");
                if (manifestLink) manifestLink.href = URL.createObjectURL(manifestBlob);
            } catch (_) {}

            const installBtn = document.getElementById("installAppBtn");
            const banner = document.getElementById("installAppBanner");
            const hintEl = document.getElementById("bannerAppHint");
            const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
            const isStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;

            if (!isStandalone && isIos && banner) {
                if (hintEl) hintEl.textContent = "Safari mein Share → Add to Home Screen dabayein";
                if (installBtn) installBtn.classList.add("hide");
                banner.classList.remove("hide");
            }

            if (installBtn && !installBtn.dataset.bound) {
                installBtn.dataset.bound = "1";
                installBtn.addEventListener("click", async () => {
                    if (!deferredInstallPrompt) return;
                    deferredInstallPrompt.prompt();
                    await deferredInstallPrompt.userChoice.catch(() => {});
                    deferredInstallPrompt = null;
                    if (banner) banner.classList.add("hide");
                });
            }
        }

        async function getResolvedSalonSlug() {
            let immediateSlug = DEFAULT_SALON_SLUG;
            try {
                immediateSlug = resolveActiveSalonId({ persist: true, fallback: DEFAULT_SALON_SLUG }) || DEFAULT_SALON_SLUG;
            } catch (_) {}

            activeSalonId = immediateSlug;
            applyDynamicSalonPwa(immediateSlug);

            const canonical = await withTimeout(
                resolveCanonicalSalonId(immediateSlug, { persist: true }),
                900,
                immediateSlug
            );
            if (canonical && canonical !== activeSalonId) {
                activeSalonId = canonical;
                applyDynamicSalonPwa(canonical);
            }

            return activeSalonId || DEFAULT_SALON_SLUG;
        }

        function getPostAuthRedirectUrl(salonSlug) {
            const targetSlug = salonSlug || activeSalonId || DEFAULT_SALON_SLUG;
            const params = new URLSearchParams(window.location.search);
            const rawNext = (params.get("next") || "").trim();
            const safePages = ["home.html", "booking.html", "payment.html", "category.html", "status.html", "history.html", "profile.html", "success.html"];
            const targetPage = safePages.includes(rawNext) ? rawNext : "home.html";
            return buildSalonUrl(targetPage, targetSlug);
        }

        async function redirectToHomeIfAuthenticated(user) {
            if (!user || isRedirecting) return;
            isRedirecting = true;

            const slug = await getResolvedSalonSlug();
            const displayName = user.displayName || (user.email ? user.email.split("@")[0] : "Customer");
            sessionStorage.setItem("salonCustomerName", displayName);
            if (user.email) {
                sessionStorage.setItem("salonCustomerEmail", user.email.trim().toLowerCase());
            }
            sessionStorage.setItem("activeSalonId", slug);

            window.location.replace(getPostAuthRedirectUrl(slug));
        }

        try {
            onAuthStateChanged(auth, async (user) => {
                window.__dismissSplashNow(true);
                try {
                    if (user) {
                        await redirectToHomeIfAuthenticated(user);
                    } else {
                        await getResolvedSalonSlug();
                    }
                } catch (_) {}
            });
        } catch (err) {
            window.__dismissSplashNow(true);
            console.error("Auth listener init error:", err);
        }

        async function syncCustomerToSalon(user, name, email, salonSlug) {
            const salonId = salonSlug || resolveActiveSalonId({ persist: true, fallback: DEFAULT_SALON_SLUG }) || DEFAULT_SALON_SLUG;
            if (!salonId || !user) return;
            await setDoc(
                getCustomerDocRef(salonId, user.uid),
                {
                    uid: user.uid,
                    name: name || user.displayName || email.split("@")[0],
                    email: email.toLowerCase(),
                    salonId,
                    updatedAt: serverTimestamp()
                },
                { merge: true }
            ).catch((err) => console.warn("Customer sync warning:", err));
        }

        function bindAuthForms() {
            const loginForm = document.getElementById("loginForm");
            const registerForm = document.getElementById("registerForm");

            if (loginForm && !loginForm.dataset.bound) {
                loginForm.dataset.bound = "1";
                loginForm.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    window.__clearAuthError();

                    const submitBtn = loginForm.querySelector('button[type="submit"]');
                    const origHtml = submitBtn ? submitBtn.innerHTML : "Login";

                    const email = (document.getElementById("loginEmail")?.value || "").trim().toLowerCase();
                    const pass = document.getElementById("loginPass")?.value || "";

                    if (!email || !pass) {
                        window.__showAuthError("⚠️ Kripya Email ID aur Password bharein.");
                        return;
                    }

                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Logging in...`;
                    }

                    try {
                        const salonSlug = await getResolvedSalonSlug();
                        isRedirecting = true;
                        const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                        const resolvedName = userCredential.user.displayName || email.split("@")[0];
                        sessionStorage.setItem("salonCustomerName", resolvedName);
                        sessionStorage.setItem("salonCustomerEmail", email);
                        sessionStorage.setItem("activeSalonId", salonSlug);

                        await Promise.race([
                            syncCustomerToSalon(userCredential.user, resolvedName, email, salonSlug),
                            new Promise((resolve) => setTimeout(resolve, 1500))
                        ]);

                        window.location.replace(getPostAuthRedirectUrl(salonSlug));
                    } catch (error) {
                        isRedirecting = false;
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = origHtml;
                        }
                        console.error("Login error:", error?.code || error);
                        if (error?.code === "auth/user-not-found" || error?.code === "auth/invalid-credential" || error?.code === "auth/invalid-email") {
                            window.__showAuthError("⚠️ Is email se account nahi bana hai! Kripya pehle Register karein.");
                        } else if (error?.code === "auth/wrong-password") {
                            window.__showAuthError("⚠️ Wrong Password! Password galat hai.");
                        } else {
                            window.__showAuthError("⚠️ Login Failed: " + (error?.message || "Please try again."));
                        }
                    }
                });
            }

            if (registerForm && !registerForm.dataset.bound) {
                registerForm.dataset.bound = "1";
                registerForm.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    window.__clearAuthError();

                    const submitBtn = registerForm.querySelector('button[type="submit"]');
                    const origHtml = submitBtn ? submitBtn.innerHTML : "Register Account";

                    const name = (document.getElementById("regName")?.value || "").trim();
                    const email = (document.getElementById("regEmail")?.value || "").trim().toLowerCase();
                    const pass = document.getElementById("regPass")?.value || "";

                    if (!name || !email) {
                        window.__showAuthError("⚠️ Kripya Full Name aur Email ID bharein.");
                        return;
                    }

                    if (pass.length < 6) {
                        window.__showAuthError("⚠️ Password kam se kam 6 characters ka hona chahiye!");
                        return;
                    }

                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Registering...`;
                    }

                    try {
                        const salonSlug = await getResolvedSalonSlug();
                        isRedirecting = true;
                        const cred = await createUserWithEmailAndPassword(auth, email, pass);
                        if (name) {
                            await updateProfile(cred.user, { displayName: name }).catch(() => {});
                        }

                        const resolvedName = name || email.split("@")[0];
                        sessionStorage.setItem("salonCustomerName", resolvedName);
                        sessionStorage.setItem("salonCustomerEmail", email);
                        sessionStorage.setItem("activeSalonId", salonSlug);

                        await Promise.race([
                            syncCustomerToSalon(cred.user, resolvedName, email, salonSlug),
                            new Promise((resolve) => setTimeout(resolve, 1500))
                        ]);

                        window.location.replace(getPostAuthRedirectUrl(salonSlug));
                    } catch (error) {
                        isRedirecting = false;
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = origHtml;
                        }
                        console.error("Register error:", error?.code || error);
                        if (error?.code === "auth/email-already-in-use") {
                            window.__showAuthError("⚠️ Already Account exists with this email! Kripya Login karein.");
                        } else if (error?.code === "auth/invalid-email") {
                            window.__showAuthError("⚠️ Wrong Email ID format!");
                        } else {
                            window.__showAuthError("⚠️ Registration Failed: " + (error?.message || "Please try again."));
                        }
                    }
                });
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", bindAuthForms);
        } else {
            bindAuthForms();
        }
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-600 to-purple-800 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <!-- Dynamic Logo/Splash Overlay -->
    <div id="salonSplashScreen" style="display:none !important; pointer-events:none;" class="hide fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950 text-white transition-opacity duration-200 p-6 text-center">
        <img id="splashImageEl" src="" alt="App Logo" class="hide max-h-56 max-w-xs rounded-3xl object-contain shadow-2xl">
    </div>

    <!-- Install App Banner -->
    <div id="installAppBanner" class="hide fixed bottom-4 left-4 right-4 z-40 max-w-md mx-auto bg-slate-900 text-white border border-slate-700 rounded-2xl p-3.5 shadow-2xl flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
            <img id="bannerAppIcon" src="" alt="App Icon" class="hide w-11 h-11 rounded-xl object-cover shrink-0">
            <div class="min-w-0">
                <p id="bannerAppName" class="text-xs font-bold truncate">Install Salon App</p>
                <p id="bannerAppHint" class="text-[10px] text-slate-400 truncate">Add to Home Screen for quick booking</p>
            </div>
        </div>
        <button id="installAppBtn" type="button" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shrink-0 cursor-pointer">
            Install
        </button>
    </div>

    <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-2xl space-y-6">
        <div class="text-center">
            <div class="bg-indigo-100 text-indigo-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold shadow-inner overflow-hidden">
                <i id="brandLogoIcon" class="fa-solid fa-scissors"></i>
                <img id="brandLogoImg" src="" alt="Brand Logo" class="hide w-full h-full object-cover">
            </div>
            <p id="brandAppTitle" class="text-[11px] font-bold uppercase tracking-wider text-indigo-600 mb-0.5">Salon App</p>
            <h2 id="screenTitle" class="text-2xl font-bold text-gray-900">Welcome Back</h2>
            <p id="screenSubtitle" class="text-xs text-gray-500 mt-1">Login to your user account</p>
        </div>

        <div id="authError" class="hide bg-red-50 border border-red-200 text-red-600 text-xs font-semibold p-3 rounded-xl text-center shadow-sm"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Email ID</label>
                <input type="email" id="loginEmail" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="user@gmail.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
                <input type="password" id="loginPass" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-sm cursor-pointer">Login</button>

            <p class="text-center text-xs text-gray-500 pt-2">
                Don't have an account? <button type="button" onclick="switchAuthView('register')" class="text-indigo-600 font-bold hover:underline cursor-pointer">Register</button>
            </p>
        </form>

        <form id="registerForm" class="hide space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Full Name</label>
                <input type="text" id="regName" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Chandu Agariya">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Email ID</label>
                <input type="email" id="regEmail" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="user@gmail.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Create Password (Min 6 chars)</label>
                <input type="password" id="regPass" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-sm cursor-pointer">Register Account</button>

            <p class="text-center text-xs text-gray-500 pt-2">
                Already have an account? <button type="button" onclick="switchAuthView('login')" class="text-indigo-600 font-bold hover:underline cursor-pointer">Login</button>
            </p>
        </form>
    </div>
</body>
</html>
