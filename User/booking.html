<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon App - Book Appointment</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>.hide { display: none !important; }</style>

    <script type="module">
        import { onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { resolveActiveSalonId, buildSalonUrl, getSalonSubcollectionRef } from "./tenant.js";

        const activeSalonId = resolveActiveSalonId({ persist: true });

        function syncLinks() {
            document.querySelectorAll("a[href]").forEach((link) => {
                const href = link.getAttribute("href");
                if (!href || href.startsWith("http") || href.startsWith("#")) return;
                const base = href.split("?")[0];
                link.setAttribute("href", buildSalonUrl(base, activeSalonId));
            });
        }
        syncLinks();

        const params = new URLSearchParams(window.location.search);
        const defaultServiceFallback = "Haircut & Styling - ₹299";
        let selectedService = (params.get("service") || "").trim() || defaultServiceFallback;
        let allServices = [];

        const fallbackSlots = [
            { label: "10:00 AM", value24: "10:00" },
            { label: "11:30 AM", value24: "11:30" },
            { label: "01:00 PM", value24: "13:00" },
            { label: "03:00 PM", value24: "15:00" },
            { label: "05:00 PM", value24: "17:00" },
            { label: "07:00 PM", value24: "19:00" }
        ];
        let slots = [];
        let activeSlot = null;

        const dateInput = document.getElementById("bookDate");
        const todayStr = new Date().toISOString().split("T")[0];
        dateInput.min = todayStr;
        dateInput.value = todayStr;

        function format24To12(time24) {
            const [hStr, mStr] = String(time24 || "10:00").split(":");
            let h = parseInt(hStr, 10);
            const ampm = h >= 12 ? "PM" : "AM";
            h = h % 12 || 12;
            return `${String(h).padStart(2, "0")}:${mStr || "00"} ${ampm}`;
        }

        function extractPriceFromText(text) {
            const match = String(text || "").match(/₹\s*(\d+(?:\.\d+)?)/);
            return match ? `₹${match[1]}` : "₹299";
        }

        function renderSlots() {
            const container = document.getElementById("slotButtonsGrid");
            const submitBtn = document.getElementById("proceedBtn");

            if (slots.length === 0) {
                container.innerHTML = `<p class="col-span-3 text-xs text-red-500 bg-red-50 border border-red-100 rounded-xl p-3 text-center">No time slots available right now. Please check back later.</p>`;
                submitBtn.disabled = true;
                submitBtn.classList.add("opacity-50", "cursor-not-allowed");
                document.getElementById("summarySchedule").innerText = "No slot available";
                return;
            }

            submitBtn.disabled = false;
            submitBtn.classList.remove("opacity-50", "cursor-not-allowed");

            if (!activeSlot || !slots.some((x) => x.value24 === activeSlot.value24)) {
                activeSlot = slots[0];
            }

            container.innerHTML = slots.map((s) => {
                const isSelected = s.value24 === activeSlot.value24;
                return `
                    <button 
                        type="button" 
                        data-time="${s.value24}"
                        class="time-slot-btn py-2.5 px-2 rounded-xl text-[11px] font-bold border transition cursor-pointer flex flex-col items-center justify-center ${isSelected ? "bg-indigo-600 text-white border-indigo-600 shadow-sm" : "bg-gray-50 text-gray-700 border-gray-200 hover:border-indigo-300"}"
                    >
                        <span>${s.label}</span>
                        ${s.tag ? `<span class="text-[9px] font-medium mt-0.5 ${isSelected ? "text-indigo-100" : "text-gray-400"}">${s.tag}</span>` : ""}
                    </button>
                `;
            }).join("");

            document.querySelectorAll(".time-slot-btn").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const val = btn.getAttribute("data-time");
                    const found = slots.find((x) => x.value24 === val);
                    if (found) {
                        activeSlot = found;
                        renderSlots();
                        updateSummary();
                    }
                });
            });

            updateSummary();
        }

        function updateSummary() {
            const dateVal = dateInput.value || todayStr;
            document.getElementById("summarySchedule").innerText = activeSlot
                ? `${dateVal} • ${activeSlot.label}`
                : `${dateVal}`;
        }

        function applyServiceDetails(serviceObj, fallbackLabel) {
            const displayLabel = serviceObj ? `${serviceObj.name} - ₹${serviceObj.price}` : fallbackLabel;
            selectedService = displayLabel;

            document.getElementById("displayServiceName").innerText = serviceObj ? serviceObj.name : fallbackLabel;
            document.getElementById("displayServicePrice").innerText = serviceObj ? `₹${serviceObj.price}` : extractPriceFromText(fallbackLabel);
            document.getElementById("displayServiceMeta").innerText = serviceObj
                ? `${serviceObj.time || "30 mins"} • ${serviceObj.category || "Salon Service"}`
                : "Standard Salon Session";

            const descEl = document.getElementById("displayServiceDesc");
            descEl.innerText = serviceObj?.description || "Includes professional consultation & hygienic salon care.";
            descEl.classList.remove("hide");

            const imgEl = document.getElementById("displayServiceImg");
            if (serviceObj && serviceObj.image) {
                imgEl.src = serviceObj.image;
                imgEl.classList.remove("hide");
                document.getElementById("displayServiceIcon").classList.add("hide");
            } else {
                imgEl.classList.add("hide");
                document.getElementById("displayServiceIcon").classList.remove("hide");
            }

            document.getElementById("summaryService").innerText = serviceObj ? serviceObj.name : fallbackLabel;
            document.getElementById("summaryDuration").innerText = serviceObj ? (serviceObj.time || "30 mins") : "30 mins";
            document.getElementById("summaryTotal").innerText = serviceObj ? `₹${serviceObj.price}` : extractPriceFromText(fallbackLabel);
            updateSummary();
        }

        applyServiceDetails(null, selectedService);

        if (!activeSalonId) {
            slots = [...fallbackSlots];
            renderSlots();
        } else {
            onSnapshot(getSalonSubcollectionRef(activeSalonId, "timeSlots"), (snap) => {
                if (snap.empty) {
                    slots = [...fallbackSlots];
                    renderSlots();
                    return;
                }
                const loaded = [];
                snap.forEach((d) => {
                    const data = d.data();
                    if (data.active !== false && data.value24) {
                        loaded.push({
                            value24: data.value24,
                            label: data.label || format24To12(data.value24),
                            tag: data.tag || ""
                        });
                    }
                });
                loaded.sort((a, b) => String(a.value24).localeCompare(String(b.value24)));
                slots = loaded.length ? loaded : [...fallbackSlots];
                renderSlots();
            }, () => {
                slots = [...fallbackSlots];
                renderSlots();
            });

            onSnapshot(getSalonSubcollectionRef(activeSalonId, "services"), (snap) => {
                const selectEl = document.getElementById("changeServiceSelect");
                allServices = snap.docs.map((docSnap) => docSnap.data());
                if (allServices.length === 0) return;

                const targetLower = selectedService.trim().toLowerCase();
                const matchedIndex = allServices.findIndex((s) => {
                    const nameLower = String(s.name || "").trim().toLowerCase();
                    const fullLower = `${nameLower} - ₹${String(s.price ?? "").toLowerCase()}`;
                    return targetLower === nameLower || targetLower === fullLower || targetLower.startsWith(nameLower + " -");
                });

                selectEl.innerHTML = allServices.map((s, idx) => {
                    const isSel = idx === matchedIndex;
                    return `<option value="${idx}" ${isSel ? "selected" : ""}>${s.name} - ₹${s.price} (${s.time || "30 mins"})</option>`;
                }).join("");

                document.getElementById("serviceSwitchWrapper").classList.remove("hide");

                if (matchedIndex !== -1) {
                    applyServiceDetails(allServices[matchedIndex], selectedService);
                }

                selectEl.onchange = () => {
                    const chosen = allServices[Number(selectEl.value)];
                    if (chosen) applyServiceDetails(chosen, `${chosen.name} - ₹${chosen.price}`);
                };
            });
        }

        dateInput.addEventListener("change", updateSummary);

        document.getElementById("bookingDetailsForm").addEventListener("submit", (e) => {
            e.preventDefault();
            if (!activeSlot) return;

            const chosenDate = dateInput.value;
            const combinedDateTime = `${chosenDate}T${activeSlot.value24}`;
            const note = document.getElementById("bookNote").value.trim();

            sessionStorage.setItem("draftBookingService", selectedService);
            sessionStorage.setItem("draftBookingTime", combinedDateTime);
            sessionStorage.setItem("draftBookingSlotLabel", `${chosenDate} (${activeSlot.label})`);
            sessionStorage.setItem("draftBookingNote", note);

            window.location.href = buildSalonUrl("payment.html", activeSalonId, {
                service: selectedService,
                time: combinedDateTime
            });
        });
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-24">

    <header class="bg-white p-4 sticky top-0 z-40 border-b border-gray-100 flex items-center justify-between max-w-md mx-auto">
        <div class="flex items-center gap-3">
            <a href="home.html" class="w-8 h-8 rounded-xl bg-gray-100 hover:bg-indigo-50 text-gray-600 hover:text-indigo-600 flex items-center justify-center transition">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </a>
            <div>
                <h1 class="text-sm font-bold text-gray-800">Book Appointment</h1>
                <p class="text-[10px] text-gray-400">Review service & pick your time slot</p>
            </div>
        </div>
        <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">Step 1 of 2</span>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 space-y-3">
            <div class="flex items-center justify-between">
                <span class="text-[10px] text-indigo-600 font-bold uppercase tracking-wider bg-indigo-50 px-2.5 py-0.5 rounded-full">Selected Service</span>
                <span id="displayServicePrice" class="text-sm font-extrabold text-indigo-600">₹299</span>
            </div>

            <div class="flex items-start gap-3">
                <div id="displayServiceIcon" class="w-12 h-12 bg-indigo-600 text-white rounded-2xl flex items-center justify-center font-bold shrink-0">
                    <i class="fa-solid fa-scissors"></i>
                </div>
                <img id="displayServiceImg" src="" alt="Service" class="hide w-12 h-12 object-cover bg-indigo-50 p-1.5 rounded-2xl border border-indigo-100 shrink-0">
                <div class="min-w-0">
                    <h3 id="displayServiceName" class="text-xs font-bold text-gray-900">Haircut & Styling</h3>
                    <p id="displayServiceMeta" class="text-[10px] text-gray-500 mt-0.5"><i class="fa-solid fa-clock mr-1 text-indigo-500"></i>30 mins • Salon Service</p>
                    <p id="displayServiceDesc" class="text-[10px] text-gray-400 mt-1 leading-relaxed"></p>
                </div>
            </div>

            <div id="serviceSwitchWrapper" class="hide pt-2 border-t border-gray-100">
                <label for="changeServiceSelect" class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Change Service (Optional)</label>
                <select id="changeServiceSelect" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-semibold text-gray-800 outline-none focus:ring-2 focus:ring-indigo-500"></select>
            </div>
        </div>

        <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
            <form id="bookingDetailsForm" class="space-y-4">
                <div>
                    <label for="bookDate" class="block text-xs font-bold text-gray-700 mb-1.5">
                        <i class="fa-regular fa-calendar text-indigo-600 mr-1"></i> Select Date
                    </label>
                    <input type="date" id="bookDate" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-xs font-semibold outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1.5">
                        <i class="fa-regular fa-clock text-indigo-600 mr-1"></i> Choose Time Slot
                    </label>
                    <div id="slotButtonsGrid" class="grid grid-cols-3 gap-2"></div>
                </div>

                <div>
                    <label for="bookNote" class="block text-xs font-bold text-gray-700 mb-1.5">
                        <i class="fa-regular fa-note-sticky text-indigo-600 mr-1"></i> Special Notes / Requests (Optional)
                    </label>
                    <textarea id="bookNote" rows="2" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Any specific hairstyle, beard trim, or instructions..."></textarea>
                </div>

                <div class="bg-indigo-50/70 border border-indigo-100 rounded-2xl p-3.5 space-y-1.5 text-xs">
                    <p class="text-[10px] font-bold uppercase tracking-wider text-indigo-700">Booking Summary</p>
                    <div class="flex justify-between gap-2">
                        <span class="text-gray-500">Service:</span>
                        <span id="summaryService" class="font-bold text-gray-900 text-right">Haircut & Styling</span>
                    </div>
                    <div class="flex justify-between gap-2">
                        <span class="text-gray-500">Duration:</span>
                        <span id="summaryDuration" class="font-semibold text-gray-700">30 mins</span>
                    </div>
                    <div class="flex justify-between gap-2">
                        <span class="text-gray-500">Date & Slot:</span>
                        <span id="summarySchedule" class="font-semibold text-gray-700">-</span>
                    </div>
                    <div class="flex justify-between gap-2 pt-1.5 border-t border-indigo-100">
                        <span class="font-bold text-gray-800">Total Amount:</span>
                        <span id="summaryTotal" class="font-extrabold text-indigo-600">₹299</span>
                    </div>
                </div>

                <button type="submit" id="proceedBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 text-xs cursor-pointer">
                    Proceed to Payment <i class="fa-solid fa-arrow-right ml-1.5"></i>
                </button>
            </form>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-100 px-6 py-2.5 flex justify-between items-center z-50">
        <a href="home.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-house text-base"></i><span class="text-[10px] font-semibold mt-0.5">Home</span></a>
        <a href="booking.html" class="flex flex-col items-center text-indigo-600"><i class="fa-solid fa-calendar-check text-base"></i><span class="text-[10px] font-bold mt-0.5">Booking</span></a>
        <a href="status.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-clock-rotate-left text-base"></i><span class="text-[10px] font-semibold mt-0.5">Status</span></a>
        <a href="history.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-receipt text-base"></i><span class="text-[10px] font-semibold mt-0.5">History</span></a>
        <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-user text-base"></i><span class="text-[10px] font-semibold mt-0.5">Profile</span></a>
    </nav>

</body>
</html>
