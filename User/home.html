<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon App - Home</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @keyframes marqueeScroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marqueeScroll 16s linear infinite;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }
    </style>

    <script type="module">
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import {
            auth,
            DEFAULT_SALON_SLUG,
            resolveActiveSalonId,
            buildSalonUrl,
            getSalonDocRef,
            getSalonSubcollectionRef,
            getCustomerDocRef
        } from "./tenant.js";

        let activeSalonId = resolveActiveSalonId({ persist: true, fallback: DEFAULT_SALON_SLUG }) || DEFAULT_SALON_SLUG;
        let currentUser = null;
        let listenersActiveKey = "";
        let unsubscribers = [];

        function safeNavigate(urlStr) {
            try {
                window.location.assign(urlStr);
            } catch (_) {
                window.location.href = urlStr;
            }
        }

        function clearListeners() {
            unsubscribers.forEach((fn) => {
                try { fn(); } catch (_) {}
            });
            unsubscribers = [];
            listenersActiveKey = "";
        }

        function syncNavLinks() {
            const navLinks = document.querySelectorAll("nav a[href]");
            navLinks.forEach((link) => {
                const rawHref = link.getAttribute("href");
                if (!rawHref || rawHref.startsWith("http") || rawHref.startsWith("#")) return;
                const basePage = rawHref.split("?")[0];
                link.setAttribute("href", buildSalonUrl(basePage, activeSalonId));
            });

            const profileHeaderLink = document.getElementById("headerProfileLink");
            if (profileHeaderLink) {
                profileHeaderLink.setAttribute("href", buildSalonUrl("profile.html", activeSalonId));
            }
        }

        syncNavLinks();

        window.goToCategory = function(categoryName) {
            const cleanCategory = String(categoryName || "").trim();
            safeNavigate(buildSalonUrl("category.html", activeSalonId, { category: cleanCategory }));
        };

        window.goToBooking = function(serviceInfo) {
            safeNavigate(buildSalonUrl("booking.html", activeSalonId, { service: serviceInfo }));
        };

        window.logout = async function() {
            sessionStorage.removeItem("salonCustomerName");
            sessionStorage.removeItem("salonCustomerEmail");
            sessionStorage.removeItem("salonCustomerPhone");
            try {
                await signOut(auth);
            } catch (e) {
                console.error("Sign out error:", e);
            }
            safeNavigate(buildSalonUrl("index.html", activeSalonId));
        };

        function updateHeaderUser(user, profileDocData = null, salonData = null) {
            const displayName =
                profileDocData?.name ||
                sessionStorage.getItem("salonCustomerName") ||
                user?.displayName ||
                (user?.email ? user.email.split("@")[0] : "") ||
                salonData?.salonName ||
                activeSalonId ||
                "Customer";
            const nameEl = document.getElementById("welcomeUserName");
            const avatarEl = document.getElementById("userAvatar");
            if (nameEl) nameEl.innerText = displayName;
            if (avatarEl) avatarEl.innerText = String(displayName).charAt(0).toUpperCase() || "C";
        }

        function renderServicesList(servicesDocs, bookingsDocs) {
            const container = document.getElementById("serviceListContainer");
            if (!container) return;

            const bookingCounts = {};
            bookingsDocs.forEach((b) => {
                const rawLabel = String(b.service || b.serviceName || b.selectedService || "").trim().toLowerCase();
                if (!rawLabel) return;
                bookingCounts[rawLabel] = (bookingCounts[rawLabel] || 0) + 1;
            });

            let services = servicesDocs.map((s) => {
                const sNameLower = String(s.name || "").trim().toLowerCase();
                const fullLabelLower = String(`${s.name || ""} - ₹${s.price || ""}`).trim().toLowerCase();
                let count = Number(s.bookingCount || s.bookings || 0);
                Object.entries(bookingCounts).forEach(([label, c]) => {
                    if (label === sNameLower || label === fullLabelLower || (sNameLower && label.includes(sNameLower))) {
                        count += c;
                    }
                });
                return { ...s, bookingCount: count };
            });

            const hasAnyBookings = services.some((item) => item.bookingCount > 0);
            if (hasAnyBookings) {
                services.sort((a, b) => b.bookingCount - a.bookingCount);
                services = services.filter((item) => item.bookingCount > 0).slice(0, 6);
            }

            let html = "";
            services.forEach((s) => {
                const safeServiceLabel = String(`${s.name} - ₹${s.price}`).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
                html += `
                    <div
                        role="button"
                        tabindex="0"
                        onclick="goToBooking('${safeServiceLabel}')"
                        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();goToBooking('${safeServiceLabel}');}"
                        class="flex items-center justify-between p-3 bg-white border border-gray-100 hover:border-indigo-200 hover:bg-indigo-50/30 active:scale-[0.99] rounded-2xl shadow-sm cursor-pointer transition"
                    >
                        <div class="flex items-center gap-3 min-w-0">
                            <img src="${s.image || "https://cdn-icons-png.flaticon.com/512/3067/3067451.png"}" class="w-10 h-10 object-cover bg-indigo-50 p-1.5 rounded-xl border shrink-0" alt="${s.name || "Service"}">
                            <div class="min-w-0">
                                <h5 class="font-bold text-xs text-gray-900 truncate">${s.name}</h5>
                                <p class="text-[10px] text-gray-400 truncate">
                                    <i class="fa-solid fa-clock mr-1"></i> ${s.time || "30 min"} • ${s.category || "General"}
                                    ${s.bookingCount > 0 ? ` • <span class="text-indigo-600 font-semibold">${s.bookingCount} booked</span>` : ""}
                                </p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 shrink-0 pl-2">
                            <p class="font-bold text-xs text-indigo-600">₹${s.price}</p>
                            <i class="fa-solid fa-chevron-right text-[10px] text-gray-400"></i>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html === "" ? `<p class="text-xs text-gray-400 text-center py-4">No services available for this salon.</p>` : html;
        }

        function startRealtimeSalonListeners(user) {
            if (!activeSalonId) {
                activeSalonId = DEFAULT_SALON_SLUG;
            }

            const key = `${activeSalonId}::${user?.uid || "guest"}`;
            if (listenersActiveKey === key) return;
            clearListeners();
            listenersActiveKey = key;
            syncNavLinks();
            updateHeaderUser(user, null, null);

            let latestServices = [];
            let latestBookings = [];
            let latestSalonData = null;

            try {
                unsubscribers.push(
                    onSnapshot(getSalonDocRef(activeSalonId), (snap) => {
                        latestSalonData = snap.exists() ? snap.data() : null;
                        updateHeaderUser(user, null, latestSalonData);
                    }, () => {})
                );
            } catch (_) {}

            if (user) {
                try {
                    unsubscribers.push(
                        onSnapshot(getCustomerDocRef(activeSalonId, user.uid), (snap) => {
                            updateHeaderUser(user, snap.exists() ? snap.data() : null, latestSalonData);
                        }, () => updateHeaderUser(user, null, latestSalonData))
                    );
                } catch (_) {}
            }

            try {
                unsubscribers.push(
                    onSnapshot(getSalonSubcollectionRef(activeSalonId, "announcements"), (querySnapshot) => {
                        const wrapper = document.getElementById("announcementWrapper");
                        const ticker = document.getElementById("scrollingAnnouncementText");
                        const messages = [];
                        querySnapshot.forEach((docSnap) => {
                            const a = docSnap.data();
                            if (a.message) {
                                messages.push(`🔥 <b>${a.title || "UPDATE"}:</b> ${a.message}`);
                            }
                        });
                        if (messages.length > 0 && ticker && wrapper) {
                            ticker.innerHTML = messages.join(" &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; ");
                            wrapper.classList.remove("hidden");
                        } else if (wrapper) {
                            wrapper.classList.add("hidden");
                        }
                    }, () => {})
                );
            } catch (_) {}

            try {
                unsubscribers.push(
                    onSnapshot(getSalonSubcollectionRef(activeSalonId, "banners"), (querySnapshot) => {
                        const container = document.getElementById("bannerSliderContainer");
                        if (!container) return;
                        const defaultBannerImg = "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1200&q=80";
                        let html = "";
                        querySnapshot.forEach((docSnap) => {
                            const b = docSnap.data();
                            const bgImg = (b.image && b.image.trim() !== "") ? b.image.trim() : defaultBannerImg;
                            const hasTag = Boolean(b.tag && String(b.tag).trim() !== "");
                            const hasTitle = Boolean(b.title && String(b.title).trim() !== "");
                            const hasSubtitle = Boolean(b.subtitle && String(b.subtitle).trim() !== "");
                            const hasAnyText = hasTag || hasTitle || hasSubtitle;

                            html += `
                                <div class="min-w-full h-36 rounded-3xl overflow-hidden relative shadow-md flex items-center p-5 text-white" style="background: linear-gradient(135deg, ${b.bgColor || "#4f46e5"}, ${b.bgColor2 || "#9333ea"});">
                                    <img
                                        src="${bgImg}"
                                        class="absolute inset-0 w-full h-full object-cover object-center z-0"
                                        alt="${hasTitle ? b.title : "Salon Banner"}"
                                        onerror="this.src='${defaultBannerImg}'"
                                    >
                                    ${hasAnyText ? `
                                        <div class="w-4/5 space-y-1 relative z-10">
                                            ${hasTag ? `<span class="inline-block bg-white/25 backdrop-blur-xs text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">${b.tag}</span>` : ""}
                                            ${hasTitle ? `<h3 class="text-sm font-bold leading-snug">${b.title}</h3>` : ""}
                                            ${hasSubtitle ? `<p class="text-[11px] text-white/95 line-clamp-2">${b.subtitle}</p>` : ""}
                                        </div>
                                    ` : ""}
                                </div>
                            `;
                        });
                        container.innerHTML = html !== "" ? html : `
                            <div class="min-w-full h-36 bg-indigo-600 rounded-3xl overflow-hidden relative shadow-md flex items-center text-white">
                                <img src="${defaultBannerImg}" class="absolute inset-0 w-full h-full object-cover object-center z-0" alt="Salon Banner">
                            </div>
                        `;
                    }, () => {})
                );
            } catch (_) {}

            try {
                unsubscribers.push(
                    onSnapshot(getSalonSubcollectionRef(activeSalonId, "categories"), (querySnapshot) => {
                        const container = document.getElementById("categoryContainer");
                        if (!container) return;
                        let html = "";
                        querySnapshot.forEach((docSnap) => {
                            const c = docSnap.data();
                            const safeCategoryName = String(c.name || "Category").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
                            html += `
                                <div
                                    role="button"
                                    tabindex="0"
                                    onclick="goToCategory('${safeCategoryName}')"
                                    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();goToCategory('${safeCategoryName}');}"
                                    class="flex flex-col items-center group cursor-pointer active:scale-95 transition"
                                >
                                    <div class="w-full h-16 bg-indigo-50 group-hover:bg-indigo-100/80 border border-indigo-100 group-hover:border-indigo-300 rounded-2xl overflow-hidden shadow-sm flex items-center justify-center p-2 mb-1 transition">
                                        <img src="${c.image || "https://cdn-icons-png.flaticon.com/512/3067/3067451.png"}" class="w-full h-full object-contain" alt="${c.name || "Category"}">
                                    </div>
                                    <p class="text-[11px] font-bold text-gray-800 group-hover:text-indigo-600 text-center truncate w-full transition">${c.name || "Category"}</p>
                                </div>
                            `;
                        });
                        container.innerHTML = html === "" ? `<p class="text-xs text-gray-400 col-span-4 text-center">No categories found for this salon.</p>` : html;
                    }, () => {})
                );
            } catch (_) {}

            try {
                unsubscribers.push(
                    onSnapshot(getSalonSubcollectionRef(activeSalonId, "services"), (snap) => {
                        latestServices = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
                        renderServicesList(latestServices, latestBookings);
                    }, () => {})
                );
            } catch (_) {}

            try {
                unsubscribers.push(
                    onSnapshot(getSalonSubcollectionRef(activeSalonId, "bookings"), (snap) => {
                        latestBookings = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
                        renderServicesList(latestServices, latestBookings);
                    }, () => {})
                );
            } catch (_) {}
        }

        startRealtimeSalonListeners(null);

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            activeSalonId = resolveActiveSalonId({ persist: true, fallback: DEFAULT_SALON_SLUG }) || activeSalonId;
            startRealtimeSalonListeners(user);
        });
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-24">

    <div id="protectedAppShell">
        <header class="bg-white p-4 sticky top-0 z-40 border-b border-gray-100 flex justify-between items-center max-w-md mx-auto">
            <a id="headerProfileLink" href="profile.html" class="flex items-center gap-2.5 group">
                <div class="w-9 h-9 bg-indigo-600 text-white rounded-full flex items-center justify-center font-bold text-sm shadow-sm" id="userAvatar">C</div>
                <div>
                    <p class="text-[10px] text-gray-400 font-medium uppercase">Welcome back</p>
                    <p id="welcomeUserName" class="text-xs font-bold text-gray-800 group-hover:text-indigo-600 transition">Customer</p>
                </div>
            </a>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 bg-gray-50 border border-gray-100 px-2.5 py-1.5 rounded-xl">
                    <i class="fa-solid fa-location-dot text-indigo-600 text-xs"></i>
                    <span class="text-[11px] font-bold text-gray-700">Chhattisgarh</span>
                </div>
                <button onclick="logout()" class="text-gray-400 hover:text-red-500 p-1.5 transition" title="Logout">
                    <i class="fa-solid fa-right-from-bracket text-sm"></i>
                </button>
            </div>
        </header>

        <main class="max-w-md mx-auto p-4 space-y-5">
            <div id="announcementWrapper" class="hidden bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-2.5 px-3 rounded-2xl shadow-sm flex items-center gap-2.5 overflow-hidden">
                <div class="bg-white/20 p-1.5 rounded-lg text-xs shrink-0">
                    <i class="fa-solid fa-bullhorn animate-pulse"></i>
                </div>
                <div class="overflow-hidden w-full relative">
                    <p id="scrollingAnnouncementText" class="animate-marquee text-xs font-medium tracking-wide"></p>
                </div>
            </div>

            <div class="relative overflow-hidden rounded-3xl shadow-md">
                <div id="bannerSliderContainer" class="flex transition-transform duration-500 ease-out"></div>
            </div>

            <div>
                <h4 class="font-bold text-gray-800 text-sm mb-3">Categories</h4>
                <div id="categoryContainer" class="grid grid-cols-4 gap-3 text-center"></div>
            </div>

            <div>
                <h4 class="font-bold text-gray-800 text-sm mb-3">Popular Services</h4>
                <div id="serviceListContainer" class="space-y-3"></div>
            </div>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-100 px-6 py-2.5 flex justify-between items-center z-50">
            <a href="home.html" class="flex flex-col items-center text-indigo-600"><i class="fa-solid fa-house text-base"></i><span class="text-[10px] font-bold mt-0.5">Home</span></a>
            <a href="booking.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-calendar-check text-base"></i><span class="text-[10px] font-semibold mt-0.5">Booking</span></a>
            <a href="status.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-clock-rotate-left text-base"></i><span class="text-[10px] font-semibold mt-0.5">Status</span></a>
            <a href="history.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-receipt text-base"></i><span class="text-[10px] font-semibold mt-0.5">History</span></a>
            <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-user text-base"></i><span class="text-[10px] font-semibold mt-0.5">Profile</span></a>
        </nav>
    </div>

    <script>
        let currentSlide = 0;
        setInterval(() => {
            const slider = document.getElementById("bannerSliderContainer");
            if (slider && slider.children.length > 1) {
                currentSlide = (currentSlide + 1) % slider.children.length;
                slider.style.transform = `translateX(-${currentSlide * 100}%)`;
            }
        }, 3000);
    </script>
</body>
</html>
