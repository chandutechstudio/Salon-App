<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon App - Booking Status</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-24">

    <header class="bg-white p-4 sticky top-0 z-40 border-b border-gray-100 flex items-center justify-between max-w-md mx-auto">
        <div class="flex items-center gap-3">
            <a href="home.html" class="w-8 h-8 rounded-xl bg-gray-100 hover:bg-indigo-50 text-gray-600 hover:text-indigo-600 flex items-center justify-center transition">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </a>
            <div>
                <h1 class="text-sm font-bold text-gray-900">Booking Status & Details</h1>
                <p id="statusSalonSub" class="text-[10px] text-gray-400">Track your service, slot & payment status</p>
            </div>
        </div>
        <span id="totalBookingsCount" class="bg-indigo-100 text-indigo-700 text-[10px] font-bold px-2.5 py-1 rounded-full">0 Bookings</span>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <div id="statusFilterTabs" class="flex items-center gap-2 overflow-x-auto pb-1">
            <button type="button" data-filter="ALL" class="filter-tab px-3.5 py-1.5 rounded-full text-[11px] font-bold bg-indigo-600 text-white shadow-sm shrink-0 transition cursor-pointer">All</button>
            <button type="button" data-filter="PENDING" class="filter-tab px-3.5 py-1.5 rounded-full text-[11px] font-bold bg-white text-gray-600 border border-gray-200 hover:border-indigo-300 shrink-0 transition cursor-pointer">Pending</button>
            <button type="button" data-filter="APPROVED" class="filter-tab px-3.5 py-1.5 rounded-full text-[11px] font-bold bg-white text-gray-600 border border-gray-200 hover:border-indigo-300 shrink-0 transition cursor-pointer">Confirmed</button>
            <button type="button" data-filter="REJECTED" class="filter-tab px-3.5 py-1.5 rounded-full text-[11px] font-bold bg-white text-gray-600 border border-gray-200 hover:border-indigo-300 shrink-0 transition cursor-pointer">Rejected</button>
        </div>

        <div id="statusListContainer" class="space-y-3">
            <div class="bg-white p-6 rounded-3xl text-center border border-gray-100 shadow-sm space-y-2">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-indigo-500"></i>
                <p class="text-xs text-gray-400 font-medium">Loading bookings from cloud...</p>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-100 px-6 py-2.5 flex justify-between items-center z-50">
        <a href="home.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-house text-base"></i><span class="text-[10px] font-semibold mt-0.5">Home</span></a>
        <a href="booking.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-calendar-check text-base"></i><span class="text-[10px] font-semibold mt-0.5">Booking</span></a>
        <a href="status.html" class="flex flex-col items-center text-indigo-600"><i class="fa-solid fa-clock-rotate-left text-base"></i><span class="text-[10px] font-bold mt-0.5">Status</span></a>
        <a href="history.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-receipt text-base"></i><span class="text-[10px] font-semibold mt-0.5">History</span></a>
        <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-user text-base"></i><span class="text-[10px] font-semibold mt-0.5">Profile</span></a>
    </nav>

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { auth, resolveActiveSalonId, buildSalonUrl, getSalonSubcollectionRef } from "./tenant.js";

        try { localStorage.removeItem("userBookings"); } catch (_) {}

        const activeSalonId = resolveActiveSalonId({ persist: true });
        let activeFilter = "ALL";
        let allBookings = [];
        let unsubscribeStatus = null;

        document.querySelectorAll("a[href]").forEach((link) => {
            const href = link.getAttribute("href");
            if (!href || href.startsWith("http") || href.startsWith("#")) return;
            const base = href.split("?")[0];
            link.setAttribute("href", buildSalonUrl(base, activeSalonId));
        });

        if (activeSalonId) {
            document.getElementById("statusSalonSub").innerText = `Salon: ${activeSalonId} • Live Status`;
        }

        function escapeHtml(str) {
            return String(str ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function extractPriceDisplay(booking) {
            if (booking.price !== undefined && booking.price !== null && String(booking.price).trim() !== "") {
                const raw = String(booking.price).trim();
                return raw.startsWith("₹") ? raw : `₹${raw}`;
            }
            if (booking.amount !== undefined && booking.amount !== null && String(booking.amount).trim() !== "" && Number(booking.amount) > 0) {
                return `₹${booking.amount}`;
            }
            const text = String(booking.service || booking.serviceName || booking.selectedService || "");
            const match = text.match(/₹\s*(\d+(?:\.\d+)?)/);
            return match ? `₹${match[1]}` : null;
        }

        function cleanServiceName(booking) {
            const raw = String(booking.serviceName || booking.service || booking.selectedService || "Salon Service").trim();
            return raw.replace(/\s*-\s*₹\s*\d+(?:\.\d+)?\s*$/i, "").trim() || raw;
        }

        function formatAppointmentTime(booking) {
            if (booking.slotLabel) return booking.slotLabel;
            const raw = String(booking.time || "").trim();
            if (!raw) return "Not specified";

            const clean = raw.replace("T", " ");
            const parts = clean.split(" ");
            const datePart = parts[0] || "";
            const timePart = parts[1] || "";

            if (timePart && /^\d{1,2}:\d{2}/.test(timePart)) {
                const [hStr, mStr] = timePart.split(":");
                let h = parseInt(hStr, 10);
                const ampm = h >= 12 ? "PM" : "AM";
                h = h % 12 || 12;
                const formatted12 = `${String(h).padStart(2, "0")}:${mStr.slice(0, 2)} ${ampm}`;
                return `${datePart} • ${formatted12}`;
            }
            return clean;
        }

        function getNormalizedStatus(statusStr) {
            const s = String(statusStr || "Pending").trim().toLowerCase();
            if (s === "successful" || s === "approved" || s === "confirmed" || s === "completed") {
                return "APPROVED";
            }
            if (s === "rejected" || s === "cancelled" || s === "failed") {
                return "REJECTED";
            }
            return "PENDING";
        }

        function matchesCurrentCustomer(booking, user) {
            const authUid = String(user?.uid || "").trim();
            const authEmail = String(user?.email || sessionStorage.getItem("salonCustomerEmail") || "").trim().toLowerCase();
            const bUid = String(booking.userId || "").trim();
            const bEmail = String(booking.userEmail || booking.email || "").trim().toLowerCase();
            const bPhone = String(booking.userPhone || booking.phone || "").trim().toLowerCase();

            if (!authUid && !authEmail) return false;
            if (authUid && bUid && authUid === bUid) return true;
            if (authEmail && ((bEmail && authEmail === bEmail) || (bPhone && authEmail === bPhone))) return true;
            return false;
        }

        function loadBookingStatus() {
            const container = document.getElementById("statusListContainer");
            document.getElementById("totalBookingsCount").innerText = `${allBookings.length} ${allBookings.length === 1 ? "Booking" : "Bookings"}`;

            const filteredItems = [];
            for (let i = allBookings.length - 1; i >= 0; i--) {
                const item = allBookings[i];
                const norm = getNormalizedStatus(item.status);
                if (activeFilter === "ALL" || activeFilter === norm) {
                    filteredItems.push({ booking: item, normStatus: norm, index: i });
                }
            }

            if (filteredItems.length === 0) {
                const homeHref = buildSalonUrl("home.html", activeSalonId);
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-3xl text-center border border-gray-100 shadow-sm space-y-2">
                        <i class="fa-solid fa-calendar-xmark text-3xl text-gray-300"></i>
                        <p class="text-xs text-gray-500 font-semibold">${allBookings.length === 0 ? "No bookings found for your account yet." : "No bookings in this filter."}</p>
                        <a href="${homeHref}" class="inline-block mt-2 bg-indigo-600 text-white text-[11px] font-bold px-4 py-2 rounded-xl shadow-sm">Book a Service</a>
                    </div>
                `;
                return;
            }

            let html = "";
            filteredItems.forEach(({ booking: b, normStatus }) => {
                const rawStatusText = escapeHtml(b.status || "Pending");
                let statusBadge = "bg-amber-50 text-amber-700 border-amber-200";
                let statusIcon = "fa-clock";
                let statusNote = "Waiting for salon confirmation.";

                if (normStatus === "APPROVED") {
                    statusBadge = "bg-emerald-50 text-emerald-700 border-emerald-200";
                    statusIcon = "fa-circle-check";
                    statusNote = "Your appointment is confirmed.";
                } else if (normStatus === "REJECTED") {
                    statusBadge = "bg-red-50 text-red-700 border-red-200";
                    statusIcon = "fa-circle-xmark";
                    statusNote = "This booking was not approved by the salon.";
                }

                const serviceTitle = escapeHtml(cleanServiceName(b));
                const priceText = extractPriceDisplay(b);
                const scheduleText = escapeHtml(formatAppointmentTime(b));
                const paymentMode = escapeHtml(b.paymentType || "UPI / Salon Pay");
                const utrCode = b.utr ? escapeHtml(` • UTR: ${b.utr}`) : "";
                const createdStr = b.createdAt ? escapeHtml(b.createdAt) : "";

                html += `
                    <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm space-y-3">
                        <div class="flex items-start justify-between gap-2 border-b border-gray-100 pb-3">
                            <div class="flex items-start gap-2.5 min-w-0">
                                <div class="w-9 h-9 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0 mt-0.5">
                                    <i class="fa-solid fa-scissors text-xs"></i>
                                </div>
                                <div class="min-w-0">
                                    <p class="text-[10px] font-bold uppercase tracking-wider text-indigo-600">Booked Service</p>
                                    <h4 class="text-xs font-extrabold text-gray-900 truncate">${serviceTitle}</h4>
                                    <div class="flex flex-wrap items-center gap-2 mt-1">
                                        ${priceText ? `<span class="text-[11px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-lg">${escapeHtml(priceText)}</span>` : ""}
                                        ${(b.timeDuration || b.duration) ? `<span class="text-[10px] text-gray-500"><i class="fa-regular fa-clock mr-1"></i>${escapeHtml(b.timeDuration || b.duration)}</span>` : ""}
                                        ${b.category ? `<span class="text-[10px] text-gray-500">• ${escapeHtml(b.category)}</span>` : ""}
                                    </div>
                                </div>
                            </div>

                            <span class="text-[10px] font-bold px-2.5 py-1 rounded-xl border flex items-center gap-1 shrink-0 ${statusBadge}">
                                <i class="fa-solid ${statusIcon}"></i> ${rawStatusText}
                            </span>
                        </div>

                        <div class="bg-gray-50/80 rounded-2xl p-3 space-y-1.5 text-[11px] text-gray-700">
                            <p class="flex items-center justify-between gap-2">
                                <span class="text-gray-500"><i class="fa-solid fa-calendar-day mr-1.5 text-indigo-500"></i>Appointment:</span>
                                <span class="font-bold text-gray-900 text-right">${scheduleText}</span>
                            </p>
                            <p class="flex items-center justify-between gap-2">
                                <span class="text-gray-500"><i class="fa-solid fa-wallet mr-1.5 text-indigo-500"></i>Payment:</span>
                                <span class="font-semibold text-gray-800 text-right truncate">${paymentMode}${utrCode}</span>
                            </p>
                            ${b.note ? `
                                <p class="pt-1 border-t border-gray-200/70 text-[10px] text-gray-500">
                                    <i class="fa-regular fa-note-sticky mr-1 text-indigo-500"></i><b>Note:</b> ${escapeHtml(b.note)}
                                </p>
                            ` : ""}
                        </div>

                        <div class="flex items-center justify-between gap-2 text-[10px] text-gray-400 pt-0.5">
                            <span class="truncate">${escapeHtml(statusNote)}</span>
                            ${createdStr ? `<span class="shrink-0">${createdStr}</span>` : ""}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function startStatusListener(user) {
            if (unsubscribeStatus) {
                unsubscribeStatus();
                unsubscribeStatus = null;
            }
            const container = document.getElementById("statusListContainer");

            if (!activeSalonId) {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-3xl text-center border border-gray-100 shadow-sm space-y-2">
                        <i class="fa-solid fa-store-slash text-3xl text-gray-300"></i>
                        <p class="text-xs text-gray-500 font-semibold">Salon ID missing. Please open via your salon booking link.</p>
                    </div>
                `;
                return;
            }

            if (!user && !sessionStorage.getItem("salonCustomerEmail")) {
                const loginHref = buildSalonUrl("index.html", activeSalonId, { next: "status.html" });
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-3xl text-center border border-gray-100 shadow-sm space-y-2.5">
                        <i class="fa-solid fa-lock text-2xl text-indigo-500"></i>
                        <p class="text-xs text-gray-600 font-semibold">Please login to view your booking status.</p>
                        <a href="${loginHref}" class="inline-block bg-indigo-600 text-white text-[11px] font-bold px-4 py-2 rounded-xl shadow-sm">Login Now</a>
                    </div>
                `;
                return;
            }

            unsubscribeStatus = onSnapshot(getSalonSubcollectionRef(activeSalonId, "bookings"), (snapshot) => {
                const list = [];
                snapshot.forEach((docSnap) => {
                    const data = { id: docSnap.id, ...docSnap.data() };
                    if (matchesCurrentCustomer(data, user)) {
                        list.push(data);
                    }
                });
                list.sort((a, b) => {
                    const ta = a.timestamp?.toMillis ? a.timestamp.toMillis() : 0;
                    const tb = b.timestamp?.toMillis ? b.timestamp.toMillis() : 0;
                    return ta - tb;
                });
                allBookings = list;
                loadBookingStatus();
            }, (err) => {
                console.error("Status listener error:", err);
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-3xl text-center border border-gray-100 shadow-sm space-y-2">
                        <i class="fa-solid fa-triangle-exclamation text-2xl text-red-400"></i>
                        <p class="text-xs text-red-500 font-semibold">Could not load booking status.</p>
                    </div>
                `;
            });
        }

        document.querySelectorAll(".filter-tab").forEach((btn) => {
            btn.addEventListener("click", () => {
                activeFilter = btn.getAttribute("data-filter");
                document.querySelectorAll(".filter-tab").forEach((t) => {
                    const isCurrent = t === btn;
                    t.className = isCurrent
                        ? "filter-tab px-3.5 py-1.5 rounded-full text-[11px] font-bold bg-indigo-600 text-white shadow-sm shrink-0 transition cursor-pointer"
                        : "filter-tab px-3.5 py-1.5 rounded-full text-[11px] font-bold bg-white text-gray-600 border border-gray-200 hover:border-indigo-300 shrink-0 transition cursor-pointer";
                });
                loadBookingStatus();
            });
        });

        onAuthStateChanged(auth, (user) => {
            startStatusListener(user);
        });
    </script>
</body>
</html>
