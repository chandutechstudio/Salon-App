<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon App - Payment & Transaction History</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-24">

    <header class="bg-white p-4 sticky top-0 z-40 border-b border-gray-100 flex items-center justify-between max-w-md mx-auto">
        <div class="flex items-center gap-3">
            <a href="home.html" class="w-8 h-8 rounded-xl bg-gray-100 hover:bg-indigo-50 text-gray-600 hover:text-indigo-600 flex items-center justify-center transition">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </a>
            <div>
                <h1 class="text-sm font-bold text-gray-900">Payment & Transaction History</h1>
                <p id="historySalonSub" class="text-[10px] text-gray-400">Cloud synced payment receipts</p>
            </div>
        </div>
        <span id="totalTxCount" class="bg-indigo-100 text-indigo-700 text-[10px] font-bold px-2.5 py-1 rounded-full">0 Txns</span>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-4 rounded-3xl shadow-md flex items-center justify-between">
            <div>
                <p class="text-[10px] uppercase tracking-wider text-indigo-100 font-semibold">Total Transaction Value</p>
                <h2 id="totalSpentAmount" class="text-xl font-extrabold mt-0.5">₹0</h2>
                <p id="summarySubtitle" class="text-[10px] text-indigo-100/90 mt-0.5">Across 0 cloud payments</p>
            </div>
            <div class="w-11 h-11 rounded-2xl bg-white/20 flex items-center justify-center text-lg shrink-0">
                <i class="fa-solid fa-receipt"></i>
            </div>
        </div>

        <div id="paymentFilterBar" class="flex items-center gap-2 overflow-x-auto pb-1">
            <button type="button" data-mode="ALL" class="mode-filter-btn px-3.5 py-1.5 rounded-full text-[11px] font-bold bg-indigo-600 text-white shadow-sm shrink-0 transition cursor-pointer">All</button>
            <button type="button" data-mode="UPI" class="mode-filter-btn px-3.5 py-1.5 rounded-full text-[11px] font-bold bg-white text-gray-600 border border-gray-200 hover:border-indigo-300 shrink-0 transition cursor-pointer">UPI</button>
            <button type="button" data-mode="CASH" class="mode-filter-btn px-3.5 py-1.5 rounded-full text-[11px] font-bold bg-white text-gray-600 border border-gray-200 hover:border-indigo-300 shrink-0 transition cursor-pointer">Cash / Salon</button>
            <button type="button" data-mode="OTHER" class="mode-filter-btn px-3.5 py-1.5 rounded-full text-[11px] font-bold bg-white text-gray-600 border border-gray-200 hover:border-indigo-300 shrink-0 transition cursor-pointer">Other</button>
        </div>

        <div class="flex justify-between items-center">
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Transaction Records</h3>
            <span id="filteredCountBadge" class="text-[10px] font-semibold text-gray-400">Showing 0</span>
        </div>

        <div id="historyListContainer" class="space-y-3">
            <div class="bg-white p-6 rounded-3xl text-center border border-gray-100 shadow-sm space-y-2">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-indigo-500"></i>
                <p class="text-xs text-gray-400 font-medium">Loading cloud transactions...</p>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-100 px-6 py-2.5 flex justify-between items-center z-50">
        <a href="home.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-house text-base"></i><span class="text-[10px] font-semibold mt-0.5">Home</span></a>
        <a href="booking.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-calendar-check text-base"></i><span class="text-[10px] font-semibold mt-0.5">Booking</span></a>
        <a href="status.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-clock-rotate-left text-base"></i><span class="text-[10px] font-semibold mt-0.5">Status</span></a>
        <a href="history.html" class="flex flex-col items-center text-indigo-600"><i class="fa-solid fa-receipt text-base"></i><span class="text-[10px] font-bold mt-0.5">History</span></a>
        <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-user text-base"></i><span class="text-[10px] font-semibold mt-0.5">Profile</span></a>
    </nav>

    <script type="module">
        import { getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { resolveActiveSalonId, buildSalonUrl, getSalonSubcollectionRef } from "./tenant.js";

        localStorage.removeItem("userBookings");

        const app = getApps()[0];
        const auth = getAuth(app);

        const activeSalonId = resolveActiveSalonId({ persist: true });
        let activeModeFilter = "ALL";
        let allCloudTransactions = [];
        let unsubscribeHistory = null;

        function syncLinks() {
            document.querySelectorAll("a[href]").forEach((link) => {
                const href = link.getAttribute("href");
                if (!href || href.startsWith("http") || href.startsWith("#")) return;
                const base = href.split("?")[0];
                link.setAttribute("href", buildSalonUrl(base, activeSalonId));
            });
        }
        syncLinks();

        if (activeSalonId) {
            document.getElementById("historySalonSub").innerText = `Salon: ${activeSalonId} • Firestore Sync`;
        }

        window.copyRefId = function(refText, btnEl) {
            if (!refText) return;
            navigator.clipboard?.writeText(refText).catch(() => {});
            if (btnEl) {
                const orig = btnEl.innerHTML;
                btnEl.innerHTML = `<i class="fa-solid fa-check text-emerald-600"></i>`;
                setTimeout(() => { btnEl.innerHTML = orig; }, 1400);
            }
        };

        function formatCreatedAt(createdAtVal, timestampVal) {
            if (timestampVal && typeof timestampVal.toDate === "function") {
                return timestampVal.toDate().toLocaleString("en-IN");
            }
            if (createdAtVal) return String(createdAtVal);
            return "";
        }

        function parseNumericPrice(booking) {
            const rawAmt = booking.amount ?? booking.price;
            if (rawAmt !== undefined && rawAmt !== null && String(rawAmt).trim() !== "") {
                const num = parseFloat(String(rawAmt).replace(/[^0-9.]/g, ""));
                if (!Number.isNaN(num)) return num;
            }
            const text = String(booking.service || booking.serviceName || booking.selectedService || "");
            const match = text.match(/₹\s*(\d+(?:\.\d+)?)/);
            return match ? parseFloat(match[1]) : 0;
        }

        function cleanServiceName(booking) {
            const raw = String(booking.serviceName || booking.service || booking.selectedService || "Salon Service").trim();
            return raw.replace(/\s*-\s*₹\s*\d+(?:\.\d+)?\s*$/i, "").trim() || raw;
        }

        function formatAppointmentTime(booking) {
            if (booking.slotLabel) return booking.slotLabel;
            const raw = String(booking.time || "").trim();
            if (!raw) return "Not specified";

            const clean = raw.replace("T", " ");
            const parts = clean.split(" ");
            const datePart = parts[0] || "";
            const timePart = parts[1] || "";

            if (timePart && /^\d{1,2}:\d{2}/.test(timePart)) {
                const [hStr, mStr] = timePart.split(":");
                let h = parseInt(hStr, 10);
                const ampm = h >= 12 ? "PM" : "AM";
                h = h % 12 || 12;
                const formatted12 = `${String(h).padStart(2, "0")}:${mStr.slice(0, 2)} ${ampm}`;
                return `${datePart} • ${formatted12}`;
            }
            return clean;
        }

        function getModeBucket(paymentType) {
            const m = String(paymentType || "").trim().toLowerCase();
            if (m.includes("upi") || m.includes("gpay") || m.includes("phonepe") || m.includes("paytm") || m.includes("qr")) {
                return "UPI";
            }
            if (m.includes("cash") || m.includes("salon") || m.includes("pay at")) {
                return "CASH";
            }
            return "OTHER";
        }

        function getStatusStyle(statusStr) {
            const s = String(statusStr || "Recorded").trim().toLowerCase();
            if (s === "successful" || s === "approved" || s === "confirmed" || s === "paid" || s === "completed") {
                return { label: statusStr || "Confirmed", cls: "bg-emerald-50 text-emerald-700 border-emerald-200", icon: "fa-circle-check" };
            }
            if (s === "rejected" || s === "cancelled" || s === "failed") {
                return { label: statusStr || "Rejected", cls: "bg-red-50 text-red-700 border-red-200", icon: "fa-circle-xmark" };
            }
            if (s === "pending") {
                return { label: "Pending", cls: "bg-amber-50 text-amber-700 border-amber-200", icon: "fa-clock" };
            }
            return { label: statusStr || "Recorded", cls: "bg-indigo-50 text-indigo-700 border-indigo-200", icon: "fa-circle-check" };
        }

        function matchesCurrentCustomer(booking, user) {
            const authUid = String(user?.uid || "").trim();
            const authEmail = String(user?.email || sessionStorage.getItem("salonCustomerEmail") || "").trim().toLowerCase();
            const authPhone = String(sessionStorage.getItem("salonCustomerPhone") || "").replace(/\D/g, "");

            const bUid = String(booking.userId || "").trim();
            const bEmail = String(booking.userEmail || booking.email || "").trim().toLowerCase();
            const bPhoneRaw = String(booking.userPhone || booking.phone || "").trim();
            const bPhoneLower = bPhoneRaw.toLowerCase();
            const bPhoneDigits = bPhoneRaw.replace(/\D/g, "");

            if (!authUid && !authEmail && !authPhone) return false;
            if (authUid && bUid && authUid === bUid) return true;
            if (authEmail && ((bEmail && authEmail === bEmail) || (bPhoneLower && authEmail === bPhoneLower))) return true;
            if (authPhone && bPhoneDigits && authPhone === bPhoneDigits) return true;
            return false;
        }

        function renderPaymentHistory() {
            const container = document.getElementById("historyListContainer");

            let totalValue = 0;
            allCloudTransactions.forEach((b) => {
                totalValue += parseNumericPrice(b);
            });

            document.getElementById("totalTxCount").innerText = `${allCloudTransactions.length} ${allCloudTransactions.length === 1 ? "Txn" : "Txns"}`;
            document.getElementById("totalSpentAmount").innerText = `₹${totalValue.toLocaleString("en-IN")}`;
            document.getElementById("summarySubtitle").innerText = `Across ${allCloudTransactions.length} ${allCloudTransactions.length === 1 ? "cloud payment" : "cloud payments"}`;

            const filteredList = [];
            for (let i = allCloudTransactions.length - 1; i >= 0; i--) {
                const b = allCloudTransactions[i];
                const bucket = getModeBucket(b.paymentType);
                if (activeModeFilter === "ALL" || activeModeFilter === bucket) {
                    filteredList.push({ booking: b, index: i });
                }
            }

            document.getElementById("filteredCountBadge").innerText = `Showing ${filteredList.length} of ${allCloudTransactions.length}`;

            if (filteredList.length === 0) {
                const homeHref = buildSalonUrl("home.html", activeSalonId);
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-3xl text-center border border-gray-100 shadow-sm space-y-2">
                        <i class="fa-solid fa-receipt text-3xl text-gray-300"></i>
                        <p class="text-xs text-gray-500 font-semibold">${allCloudTransactions.length === 0 ? "No payment history found in cloud yet." : "No transactions match this filter."}</p>
                        <a href="${homeHref}" class="inline-block mt-2 bg-indigo-600 text-white text-[11px] font-bold px-4 py-2 rounded-xl shadow-sm">Explore Services</a>
                    </div>
                `;
                return;
            }

            let html = "";
            filteredList.forEach(({ booking: b, index }) => {
                const serviceTitle = cleanServiceName(b);
                const amountNum = parseNumericPrice(b);
                const amountDisplay = amountNum > 0 ? `₹${amountNum.toLocaleString("en-IN")}` : "As per service";
                const paymentMode = b.paymentType || "UPI Payment";
                const utrId = b.utr && String(b.utr).trim() !== "" ? String(b.utr).trim() : "N/A";
                const appointmentText = formatAppointmentTime(b);
                const statusInfo = getStatusStyle(b.status);
                const txnId = b.id ? b.id.slice(0, 8).toUpperCase() : `TXN-${String(index + 1).padStart(3, "0")}`;
                const createdStr = formatCreatedAt(b.createdAt, b.timestamp);
                const safeUtr = utrId.replace(/\\/g, "\\\\").replace(/'/g, "\\'");

                html += `
                    <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm space-y-3">
                        <div class="flex items-start justify-between gap-2 border-b border-gray-100 pb-3">
                            <div class="flex items-start gap-2.5 min-w-0">
                                <div class="w-9 h-9 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0 mt-0.5">
                                    <i class="fa-solid fa-bag-shopping text-xs"></i>
                                </div>
                                <div class="min-w-0">
                                    <p class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Receipt • ${txnId}</p>
                                    <h4 class="text-xs font-extrabold text-gray-900 truncate">${serviceTitle}</h4>
                                    <div class="flex flex-wrap items-center gap-1.5 mt-1">
                                        <span class="bg-indigo-50 text-indigo-700 text-[10px] font-bold px-2 py-0.5 rounded-lg">${paymentMode}</span>
                                        ${b.category ? `<span class="text-[10px] text-gray-500">• ${b.category}</span>` : ""}
                                        ${b.timeDuration || b.duration ? `<span class="text-[10px] text-gray-500">• ${b.timeDuration || b.duration}</span>` : ""}
                                    </div>
                                </div>
                            </div>

                            <div class="text-right shrink-0">
                                <p class="text-xs font-extrabold text-indigo-600">${amountDisplay}</p>
                                <span class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-lg border mt-1 ${statusInfo.cls}">
                                    <i class="fa-solid ${statusInfo.icon}"></i> ${statusInfo.label}
                                </span>
                            </div>
                        </div>

                        <div class="bg-gray-50/80 rounded-2xl p-3 space-y-1.5 text-[11px] text-gray-700">
                            <div class="flex items-center justify-between gap-2">
                                <span class="text-gray-500 shrink-0"><i class="fa-solid fa-fingerprint mr-1.5 text-indigo-500"></i>UTR / Ref ID:</span>
                                <div class="flex items-center gap-1.5 min-w-0">
                                    <span class="font-bold text-gray-900 truncate">${utrId}</span>
                                    ${utrId !== "N/A" ? `
                                        <button type="button" onclick="copyRefId('${safeUtr}', this)" class="text-gray-400 hover:text-indigo-600 p-0.5 transition cursor-pointer" title="Copy UTR">
                                            <i class="fa-regular fa-copy text-[11px]"></i>
                                        </button>
                                    ` : ""}
                                </div>
                            </div>

                            <div class="flex items-center justify-between gap-2">
                                <span class="text-gray-500 shrink-0"><i class="fa-solid fa-calendar-check mr-1.5 text-indigo-500"></i>Appointment:</span>
                                <span class="font-semibold text-gray-800 text-right">${appointmentText}</span>
                            </div>

                            ${b.userName || b.userPhone ? `
                                <div class="flex items-center justify-between gap-2">
                                    <span class="text-gray-500 shrink-0"><i class="fa-regular fa-user mr-1.5 text-indigo-500"></i>Customer:</span>
                                    <span class="font-medium text-gray-700 text-right truncate">${[b.userName, b.userPhone].filter(Boolean).join(" • ")}</span>
                                </div>
                            ` : ""}

                            ${b.salonId ? `
                                <div class="flex items-center justify-between gap-2">
                                    <span class="text-gray-500 shrink-0"><i class="fa-solid fa-store mr-1.5 text-indigo-500"></i>Salon:</span>
                                    <span class="font-medium text-gray-700 text-right truncate">${b.salonId}</span>
                                </div>
                            ` : ""}

                            ${b.note ? `
                                <div class="pt-1.5 border-t border-gray-200/70 text-[10px] text-gray-500">
                                    <i class="fa-regular fa-note-sticky mr-1 text-indigo-500"></i><b>Note:</b> ${b.note}
                                </div>
                            ` : ""}
                        </div>

                        <div class="flex items-center justify-between gap-2 text-[10px] text-gray-400 pt-0.5">
                            <span>${createdStr ? `Booked on: ${createdStr}` : "Cloud Transaction"}</span>
                            <span class="text-emerald-600 font-semibold"><i class="fa-solid fa-cloud-check mr-0.5"></i> Firestore</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function startLiveHistoryListener(user) {
            if (unsubscribeHistory) {
                unsubscribeHistory();
                unsubscribeHistory = null;
            }

            const container = document.getElementById("historyListContainer");
            if (!activeSalonId) {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-3xl text-center border border-gray-100 shadow-sm space-y-2">
                        <i class="fa-solid fa-store-slash text-3xl text-gray-300"></i>
                        <p class="text-xs text-gray-500 font-semibold">Salon ID missing. Please open via your salon booking link.</p>
                    </div>
                `;
                return;
            }

            try {
                const bookingsRef = getSalonSubcollectionRef(activeSalonId, "bookings");
                unsubscribeHistory = onSnapshot(bookingsRef, (snapshot) => {
                    const list = [];
                    snapshot.forEach((docSnap) => {
                        const data = { id: docSnap.id, ...docSnap.data() };
                        if (matchesCurrentCustomer(data, user)) {
                            list.push(data);
                        }
                    });
                    allCloudTransactions = list;
                    renderPaymentHistory();
                }, (err) => {
                    console.error("History snapshot error:", err);
                    container.innerHTML = `
                        <div class="bg-white p-6 rounded-3xl text-center border border-gray-100 shadow-sm space-y-2">
                            <i class="fa-solid fa-triangle-exclamation text-2xl text-red-400"></i>
                            <p class="text-xs text-red-500 font-semibold">Could not load history from cloud.</p>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("History ref error:", err);
            }
        }

        document.querySelectorAll(".mode-filter-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                activeModeFilter = btn.getAttribute("data-mode");
                document.querySelectorAll(".mode-filter-btn").forEach((b) => {
                    const active = b === btn;
                    b.className = active
                        ? "mode-filter-btn px-3.5 py-1.5 rounded-full text-[11px] font-bold bg-indigo-600 text-white shadow-sm shrink-0 transition cursor-pointer"
                        : "mode-filter-btn px-3.5 py-1.5 rounded-full text-[11px] font-bold bg-white text-gray-600 border border-gray-200 hover:border-indigo-300 shrink-0 transition cursor-pointer";
                });
                renderPaymentHistory();
            });
        });

        onAuthStateChanged(auth, (user) => {
            startLiveHistoryListener(user);
        });
    </script>
</body>
</html>
