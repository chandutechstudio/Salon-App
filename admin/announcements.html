<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Admin - Manage Announcements</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { addDoc, getDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { auth, db, normalizeSalonId, getSalonDocRef, getSalonSubcollectionRef } from "./tenant.js";

        let salonId = "";
        let unsubscribeAnn = null;

        async function resolveSyncedSalonId(user) {
            const params = new URLSearchParams(window.location.search);
            let slug = normalizeSalonId(
                params.get("salon") ||
                sessionStorage.getItem("activeSalonId") ||
                ""
            );

            const emailKey = (user?.email || sessionStorage.getItem("adminEmail") || "").trim().toLowerCase();
            const emailSlug = normalizeSalonId(emailKey);

            if (emailSlug) {
                try {
                    const emailDoc = await getDoc(getSalonDocRef(emailSlug));
                    if (emailDoc.exists() && emailDoc.data()?.linkedSalonSlug) {
                        slug = normalizeSalonId(emailDoc.data().linkedSalonSlug) || slug;
                    }
                } catch (_) {}
            }

            if (!slug && emailSlug) slug = emailSlug;

            if (slug) {
                sessionStorage.setItem("activeSalonId", slug);
            }
            return slug;
        }

        function getAnnouncementsRef() {
            return getSalonSubcollectionRef(salonId, "announcements");
        }

        function listenAnnouncements() {
            if (unsubscribeAnn) unsubscribeAnn();
            unsubscribeAnn = onSnapshot(getAnnouncementsRef(), (snapshot) => {
                const container = document.getElementById("announcementList");
                let html = "";
                snapshot.forEach((item) => {
                    const a = item.data();
                    html += `
                        <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm flex items-center justify-between gap-4">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-base shrink-0">
                                    <i class="fa-solid fa-bullhorn"></i>
                                </div>
                                <div>
                                    <h4 class="text-xs font-bold text-gray-900 uppercase">${a.title || "Announcement"}</h4>
                                    <p class="text-xs text-gray-500 mt-0.5">${a.message}</p>
                                </div>
                            </div>
                            <button onclick="deleteAnnouncement('${item.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 p-2.5 rounded-xl text-xs transition shrink-0 cursor-pointer" title="Delete">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                });
                container.innerHTML = html === "" ? `<p class="text-xs text-gray-400 text-center py-4">No active announcements.</p>` : html;
            });
        }

        document.getElementById("announcementForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!salonId) return;
            const btn = document.getElementById("publishBtn");
            btn.disabled = true;
            btn.innerText = "Publishing...";

            const data = {
                title: document.getElementById("annTitle").value.trim(),
                message: document.getElementById("annMessage").value.trim(),
                salonId,
                createdAt: serverTimestamp()
            };

            try {
                await addDoc(getAnnouncementsRef(), data);
                document.getElementById("announcementForm").reset();
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Publish Announcement";
            }
        });

        window.deleteAnnouncement = async function(id) {
            if (!salonId || !confirm("Delete this announcement?")) return;
            try {
                await deleteDoc(doc(db, "salons", salonId, "announcements", id));
            } catch (err) {
                alert("Error deleting: " + err.message);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            salonId = await resolveSyncedSalonId(user);
            if (!salonId) {
                window.location.href = "index.html";
                return;
            }
            document.getElementById("activeSlugHeader").innerText = `Salon: ${salonId}`;
            listenAnnouncements();
        });
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">

        <header class="bg-blue-600 text-white p-6 rounded-3xl shadow-md flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="settings.html" class="bg-white/20 hover:bg-white/30 text-white p-2.5 rounded-xl transition"><i class="fa-solid fa-arrow-left text-sm"></i></a>
                <div>
                    <h1 class="text-xl font-bold">Manage Announcements</h1>
                    <p class="text-xs text-blue-100 mt-0.5"><span id="activeSlugHeader">Syncing salon...</span></p>
                </div>
            </div>
            <a href="settings.html" class="bg-white text-blue-700 px-4 py-2 rounded-xl text-xs font-bold shadow hover:bg-blue-50 transition">Settings</a>
        </header>

        <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm">
            <h2 class="text-sm font-bold text-gray-900 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-blue-600"></i> Create New Announcement
            </h2>
            <form id="announcementForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Heading / Title (e.g., Festive Notice, Salon Timings)</label>
                    <input type="text" id="annTitle" placeholder="ANNOUNCEMENT" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Announcement Message</label>
                    <textarea id="annMessage" rows="2" placeholder="New festive discount packages are now live! Book your slot early." required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <button type="submit" id="publishBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-md text-xs cursor-pointer">
                    Publish Announcement
                </button>
            </form>
        </div>

        <div>
            <h3 class="text-sm font-bold text-gray-800 mb-3">Live Announcements</h3>
            <div id="announcementList" class="space-y-3"></div>
        </div>

    </div>

</body>
</html>
