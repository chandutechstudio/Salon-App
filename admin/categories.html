<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Admin - Manage Categories</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { addDoc, getDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { db, normalizeSalonId, getSalonDocRef, getSalonSubcollectionRef } from "./tenant.js";

        const auth = getAuth();
        let salonId = "";

        async function resolveSyncedSalonId(user) {
            const params = new URLSearchParams(window.location.search);
            let slug = normalizeSalonId(
                params.get("salon") ||
                sessionStorage.getItem("activeSalonId") ||
                localStorage.getItem("currentSalonSlug") ||
                localStorage.getItem("activeSalonId") ||
                ""
            );

            const emailKey = (user?.email || localStorage.getItem("adminEmail") || "").trim().toLowerCase();
            const emailSlug = normalizeSalonId(emailKey);

            if (emailSlug) {
                try {
                    const emailDoc = await getDoc(getSalonDocRef(emailSlug));
                    if (emailDoc.exists() && emailDoc.data()?.linkedSalonSlug) {
                        slug = normalizeSalonId(emailDoc.data().linkedSalonSlug) || slug;
                    }
                } catch (_) {}
            }

            if (!slug && emailSlug) slug = emailSlug;

            if (slug) {
                sessionStorage.setItem("activeSalonId", slug);
                localStorage.setItem("activeSalonId", slug);
                localStorage.setItem("currentSalonSlug", slug);
            }
            return slug;
        }

        function getCategoriesRef() {
            return getSalonSubcollectionRef(salonId, "categories");
        }

        async function loadCategoriesFromCloud() {
            const container = document.getElementById("categoryListContainer");
            container.innerHTML = `<p class="text-xs text-gray-400 text-center py-8">Loading categories from cloud...</p>`;
            
            try {
                const querySnapshot = await getDocs(getCategoriesRef());
                let html = "";
                let count = 0;

                querySnapshot.forEach((document) => {
                    count++;
                    const c = document.data();
                    const docId = document.id;

                    html += `
                        <div class="flex items-center justify-between p-3.5 bg-gray-50 border border-gray-100 rounded-2xl">
                            <div class="flex items-center gap-3">
                                <img src="${c.image}" class="w-10 h-10 object-contain bg-white p-1 rounded-xl border" alt="${c.name}">
                                <div>
                                    <h4 class="font-bold text-xs text-gray-900">${c.name}</h4>
                                    <p class="text-[10px] text-indigo-600 font-medium">Salon: ${salonId}</p>
                                </div>
                            </div>
                            <button onclick="deleteCloudCategory('${docId}')" class="text-red-400 hover:text-red-600 p-2 cursor-pointer"><i class="fa-solid fa-trash text-sm"></i></button>
                        </div>
                    `;
                });

                document.getElementById("categoryCountBadge").innerText = `${count} Categories`;
                container.innerHTML = html === "" ? `<p class="text-xs text-gray-400 text-center py-8">No categories added yet.</p>` : html;
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p class="text-xs text-red-400 text-center py-8">Failed to load categories from cloud.</p>`;
            }
        }

        document.getElementById("categoryForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!salonId) return;
            const name = document.getElementById("catName").value.trim();
            const image = document.getElementById("catImg").value.trim();

            try {
                await addDoc(getCategoriesRef(), {
                    name,
                    image,
                    salonId,
                    createdAt: new Date()
                });
                alert("Category added to your salon cloud successfully!");
                document.getElementById("categoryForm").reset();
                loadCategoriesFromCloud();
            } catch (err) {
                console.error(err);
                alert("Error saving category to cloud.");
            }
        });

        window.deleteCloudCategory = async function(docId) {
            if (!salonId) return;
            if (confirm("Are you sure you want to delete this category?")) {
                try {
                    await deleteDoc(doc(db, "salons", salonId, "categories", docId));
                    alert("Category deleted successfully!");
                    loadCategoriesFromCloud();
                } catch (err) {
                    console.error(err);
                    alert("Failed to delete category.");
                }
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user && localStorage.getItem("isAdminLoggedIn") !== "true") {
                window.location.href = "index.html";
                return;
            }
            salonId = await resolveSyncedSalonId(user);
            if (!salonId) {
                window.location.href = "index.html";
                return;
            }
            document.getElementById("activeSlugHeader").innerText = `Salon: ${salonId}`;
            loadCategoriesFromCloud();
        });
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <header class="bg-indigo-600 text-white p-6 rounded-3xl shadow-md flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="settings.html" class="bg-white/20 hover:bg-white/30 text-white p-2.5 rounded-xl transition"><i class="fa-solid fa-arrow-left text-sm"></i></a>
                <div>
                    <h1 class="text-xl font-bold">Manage Categories (Cloud)</h1>
                    <p class="text-xs text-indigo-200 mt-0.5"><span id="activeSlugHeader">Syncing salon...</span></p>
                </div>
            </div>
            <a href="dashboard.html" class="bg-white text-indigo-700 px-4 py-2 rounded-xl text-xs font-bold shadow hover:bg-indigo-50 transition">Dashboard</a>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm space-y-4 md:col-span-1">
                <h3 class="font-bold text-base text-gray-900 border-b pb-2"><i class="fa-solid fa-layer-group text-indigo-600 mr-1"></i> Add Category</h3>
                <form id="categoryForm" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Category Name</label>
                        <input type="text" id="catName" required class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g., Haircut, Facial, Spa">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-semibold text-gray-600">Category Image URL</label>
                            <span class="text-[10px] text-indigo-600 font-bold bg-indigo-50 px-2 py-0.5 rounded">Best Size: 512x512 px</span>
                        </div>
                        <input type="url" id="catImg" required class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Paste direct image link">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-indigo-100 cursor-pointer">Add Category to Cloud</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm space-y-4 md:col-span-2">
                <div class="flex justify-between items-center border-b pb-2">
                    <h3 class="font-bold text-base text-gray-900"><i class="fa-solid fa-list text-indigo-600 mr-1"></i> Cloud Categories List</h3>
                    <span id="categoryCountBadge" class="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full">0 Categories</span>
                </div>

                <div id="categoryListContainer" class="space-y-3 max-h-[400px] overflow-y-auto pr-1">
                    <p class="text-xs text-gray-400 text-center py-8">Loading categories from cloud...</p>
                </div>
            </div>

        </div>

    </div>
</body>
</html>
