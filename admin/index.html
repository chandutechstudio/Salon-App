<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Admin - Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>.hide { display: none !important; }</style>

    <script type="module">
        import { getDoc, setDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { auth, db, normalizeSalonId, getSalonDocRef, resolveCanonicalSalonId } from "./tenant.js";

        function saveAdminSession(salonSlug, ownerEmail, salonName = "") {
            sessionStorage.setItem("activeSalonId", salonSlug);
            sessionStorage.setItem("adminEmail", ownerEmail);
            if (salonName) {
                sessionStorage.setItem("salonName", salonName);
            }
        }

        window.switchView = function(viewName) {
            document.getElementById("adminLoginForm").classList.add("hide");
            document.getElementById("forgetForm").classList.add("hide");
            document.getElementById("authError").classList.add("hide");

            if (viewName === "login") {
                document.getElementById("adminLoginForm").classList.remove("hide");
                document.getElementById("authTitle").innerText = "Admin Portal";
                document.getElementById("authSubtitle").innerText = "Sign in to manage your salon dashboard";
            } else if (viewName === "forget") {
                document.getElementById("forgetForm").classList.remove("hide");
                document.getElementById("authTitle").innerText = "Recover Password";
                document.getElementById("authSubtitle").innerText = "We will send a reset link to your registered email";
            }
        };

        async function resolveLoginEmail(userIdInput, salonSlugHint = "") {
            const raw = userIdInput.trim();
            if (raw.includes("@")) {
                return { email: raw.toLowerCase(), salonSlug: normalizeSalonId(salonSlugHint) };
            }

            if (raw.toLowerCase() === "admin") {
                const params = new URLSearchParams(window.location.search);
                const rawSlug =
                    salonSlugHint ||
                    params.get("salon") ||
                    localStorage.getItem("lastPurchasedSalonSlug") ||
                    "";
                const targetSlug = rawSlug ? await resolveCanonicalSalonId(rawSlug) : "";

                if (targetSlug) {
                    const salonSnap = await getDoc(getSalonDocRef(targetSlug));
                    if (salonSnap.exists() && salonSnap.data()?.ownerEmail) {
                        return {
                            email: salonSnap.data().ownerEmail.trim().toLowerCase(),
                            salonSlug: targetSlug
                        };
                    }
                }

                const q = query(collection(db, "salons"), where("defaultUserId", "==", "Admin"));
                const snap = await getDocs(q);
                let latestDoc = null;
                snap.forEach((d) => {
                    const data = d.data();
                    if (data?.ownerEmail) {
                        if (!latestDoc || (data.createdAtMs || 0) > (latestDoc.createdAtMs || 0)) {
                            latestDoc = data;
                        }
                    }
                });
                if (latestDoc?.ownerEmail) {
                    const canonical = await resolveCanonicalSalonId(latestDoc.salonId || "");
                    return {
                        email: latestDoc.ownerEmail.trim().toLowerCase(),
                        salonSlug: canonical || normalizeSalonId(latestDoc.salonId || "")
                    };
                }
            }
            return { email: "", salonSlug: "" };
        }

        document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const userIdInput = document.getElementById("loginUserId").value.trim();
            const pass = document.getElementById("loginPass").value.trim();
            const btn = e.target.querySelector('button[type="submit"]');

            if (!userIdInput || !pass) {
                showError("User ID aur Password enter karein.");
                return;
            }

            setLoading(btn, true, "Verifying...");
            clearError();

            try {
                const resolved = await resolveLoginEmail(userIdInput);
                const ownerEmail = resolved.email;

                if (!ownerEmail || !ownerEmail.includes("@")) {
                    showError("Account nahi mila! Kripya apna registered Email ya sahi Admin Link use karein.");
                    setLoading(btn, false, "Login to Dashboard");
                    return;
                }

                await signInWithEmailAndPassword(auth, ownerEmail, pass);

                const emailSlug = normalizeSalonId(ownerEmail);
                let salonSlug = resolved.salonSlug || emailSlug;
                let salonName = "";

                const emailDoc = await getDoc(getSalonDocRef(emailSlug));
                if (emailDoc.exists()) {
                    const data = emailDoc.data() || {};
                    if (data.linkedSalonSlug) {
                        salonSlug = normalizeSalonId(data.linkedSalonSlug) || salonSlug;
                    }
                    salonName = data.salonName || "";
                }

                if (salonSlug) {
                    salonSlug = await resolveCanonicalSalonId(salonSlug);
                }

                await setDoc(getSalonDocRef(salonSlug), {
                    salonId: salonSlug,
                    ownerEmail,
                    lastLoginAt: serverTimestamp()
                }, { merge: true });

                saveAdminSession(salonSlug, ownerEmail, salonName);
                window.location.href = `dashboard.html?salon=${encodeURIComponent(salonSlug)}`;
            } catch (error) {
                console.error("Login Error:", error);
                showError("Galat User ID ya Password! Kripya dobara koshish karein.");
                setLoading(btn, false, "Login to Dashboard");
            }
        });

        document.getElementById("forgetForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("forgetEmail").value.trim().toLowerCase();
            const btn = e.target.querySelector('button[type="submit"]');

            setLoading(btn, true, "Sending Email...");
            clearError();

            try {
                await sendPasswordResetEmail(auth, email);
                alert(`Password reset link successfully sent to ${email}! Kripya Gmail check karein.`);
                switchView("login");
                setLoading(btn, false, "Send Recovery Email");
            } catch (error) {
                console.error("Reset Error:", error);
                showError("Email nahi mila. Kripya valid registered email dalein.");
                setLoading(btn, false, "Send Recovery Email");
            }
        });

        function showError(msg) {
            const errorBox = document.getElementById("authError");
            errorBox.innerText = msg;
            errorBox.classList.remove("hide");
        }

        function clearError() {
            document.getElementById("authError").classList.add("hide");
        }

        function setLoading(btn, isLoading, text) {
            if (isLoading) {
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${text}`;
                btn.disabled = true;
            } else {
                btn.innerHTML = text;
                btn.disabled = false;
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-gray-900 to-indigo-950 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-2xl space-y-6">
        <div class="text-center">
            <div class="bg-indigo-100 text-indigo-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold shadow-inner">
                <i class="fa-solid fa-scissors"></i>
            </div>
            <h2 id="authTitle" class="text-2xl font-bold text-gray-900">Admin Portal</h2>
            <p id="authSubtitle" class="text-xs text-gray-500 mt-1">Sign in to manage your salon dashboard</p>
        </div>

        <div id="authError" class="hide bg-red-50 border border-red-200 text-red-600 text-xs font-semibold p-3 rounded-xl text-center shadow-sm"></div>

        <form id="adminLoginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">User ID or Admin Email</label>
                <input type="text" id="loginUserId" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Admin or owner@salon.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
                <input type="password" id="loginPass" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
            </div>
            <div class="flex justify-end items-center text-xs">
                <button type="button" onclick="switchView('forget')" class="text-gray-500 hover:underline font-medium">Forgot Password?</button>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-sm cursor-pointer">Login to Dashboard</button>
        </form>

        <form id="forgetForm" class="hide space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Enter Registered Email</label>
                <input type="email" id="forgetEmail" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="owner@salon.com">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-sm cursor-pointer">Send Recovery Email</button>

            <p class="text-center text-xs text-gray-500 pt-1">
                Remember credentials? <button type="button" onclick="switchView('login')" class="text-indigo-600 font-bold hover:underline">Back to Login</button>
            </p>
        </form>
    </div>
</body>
</html>
