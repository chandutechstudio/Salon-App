<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Admin - Subscription & Trial</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDoc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { auth, getSubscriptionDocRef, verifyAdminSalonAccess } from "./tenant.js";

        const ZAPUPI_KEY = "Zapfba972d2f8d8d61bf40b15535d3e1424";

        let currentAmount = 100;
        let currentPlanText = "1 Month Plan";
        let currentPlanDays = 30;
        let salonId = "";
        let unsubscribeSub = null;

        function applyTrialUiState(claimed) {
            const trialCard = document.getElementById("freeTrialCard");
            const trialInput = document.getElementById("trialRadio");
            const trialText = document.getElementById("trialSubText");

            if (claimed) {
                trialCard.classList.remove("cursor-pointer", "border-green-500", "bg-green-50/50");
                trialCard.classList.add("opacity-50", "bg-gray-100", "border-gray-300", "cursor-not-allowed");
                trialInput.disabled = true;
                trialText.innerText = "Already Claimed";
                trialText.className = "text-[10px] text-red-500 font-bold mt-2";

                if (currentAmount === 0) {
                    const defaultCard = document.getElementById("defaultPlanCard");
                    if (defaultCard) defaultCard.click();
                }
            } else {
                const trialCardEl = document.getElementById("freeTrialCard");
                if (trialCardEl && currentAmount === 100 && currentPlanText === "1 Month Plan") {
                    trialCardEl.click();
                }
            }
        }

        function listenSubscriptionPage() {
            if (unsubscribeSub) unsubscribeSub();
            unsubscribeSub = onSnapshot(getSubscriptionDocRef(salonId), (docSnap) => {
                const claimed = docSnap.exists() && docSnap.data().trialClaimed === true;
                applyTrialUiState(claimed);
            }, (error) => {
                console.error("Error checking trial status:", error);
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const candidate = params.get("salon") || sessionStorage.getItem("activeSalonId") || "";
            const access = await verifyAdminSalonAccess(user, candidate);

            if (!access.ok || !access.salonId) {
                sessionStorage.clear();
                window.location.href = "index.html";
                return;
            }

            salonId = access.salonId;
            sessionStorage.setItem("activeSalonId", salonId);

            if (access.redirectedFromUnauthorized || params.get("salon") !== salonId) {
                const cleanUrl = new URL(window.location.href);
                cleanUrl.searchParams.set("salon", salonId);
                window.history.replaceState({}, document.title, cleanUrl.toString());
            }

            document.getElementById("activeSlugHeader").innerText = `Salon: ${salonId}`;
            listenSubscriptionPage();
        });

        window.selectPlan = function(amount, planName, days, element) {
            currentAmount = amount;
            currentPlanText = planName;
            currentPlanDays = days;

            document.querySelectorAll(".plan-card").forEach((card) => {
                if (!card.classList.contains("cursor-not-allowed")) {
                    card.classList.remove("border-indigo-600", "bg-indigo-50/50", "border-green-500", "bg-green-50/50");
                    card.classList.add("border-gray-200", "bg-white");
                    const radio = card.querySelector('input[type="radio"]');
                    if (radio) radio.checked = false;
                }
            });

            const proceedBtn = document.getElementById("proceedBtn");

            if (amount === 0) {
                if (element.classList.contains("cursor-not-allowed")) {
                    proceedBtn.innerText = "Free Trial Already Used";
                    proceedBtn.className = "w-full bg-gray-400 text-white font-bold py-3.5 rounded-xl text-xs cursor-not-allowed flex items-center justify-center gap-2";
                    proceedBtn.disabled = true;
                    return;
                } else {
                    element.classList.remove("border-gray-200", "bg-white");
                    element.classList.add("border-green-500", "bg-green-50/50");
                    proceedBtn.innerText = "Activate 7 Days Free Trial";
                    proceedBtn.className = "w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-green-100 flex items-center justify-center gap-2";
                    proceedBtn.disabled = false;
                }
            } else {
                element.classList.remove("border-gray-200", "bg-white");
                element.classList.add("border-indigo-600", "bg-indigo-50/50");
                proceedBtn.innerText = `Proceed to Pay ₹${amount} via ZapUPI`;
                proceedBtn.className = "w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-indigo-100 flex items-center justify-center gap-2";
                proceedBtn.disabled = false;
            }

            const radio = element.querySelector('input[type="radio"]');
            if (radio) radio.checked = true;
        };

        window.handleAction = async function() {
            if (!salonId || !auth.currentUser) return;
            const btn = document.getElementById("proceedBtn");

            if (currentAmount === 0) {
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Activating Trial...`;
                btn.disabled = true;

                try {
                    const docRef = getSubscriptionDocRef(salonId);
                    const docSnap = await getDoc(docRef);

                    if (docSnap.exists() && docSnap.data().trialClaimed === true) {
                        window.showCustomPopup("Error", "Aap pehle hi Free Trial use kar chuke hain!", "error");
                        btn.disabled = false;
                        return;
                    }

                    const expiryDate = new Date();
                    expiryDate.setDate(expiryDate.getDate() + 7);

                    await setDoc(docRef, {
                        salonId,
                        ownerUid: auth.currentUser.uid,
                        ownerEmail: (auth.currentUser.email || "").toLowerCase(),
                        plan: "7 Days Free Trial",
                        status: "Active",
                        validity: expiryDate.toISOString(),
                        trialClaimed: true,
                        updatedAt: serverTimestamp()
                    }, { merge: true });

                    window.showCustomPopup("Trial Activated!", "7 Days Free Trial has been activated successfully.", "success");
                } catch (error) {
                    console.error("Error:", error);
                    window.showCustomPopup("Error", "Kuch error aayi, dobara try karein.", "error");
                    btn.innerHTML = `<i class="fa-solid fa-check"></i> Activate 7 Days Free Trial`;
                    btn.disabled = false;
                }
            } else {
                const originalText = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Connecting to ZapUPI...`;
                btn.disabled = true;

                try {
                    const orderId = "SALON_" + Date.now();
                    sessionStorage.setItem("pendingPlanOrderId", orderId);
                    sessionStorage.setItem("pendingPlanDays", String(currentPlanDays));
                    sessionStorage.setItem("pendingPlanName", currentPlanText);

                    const successUrl = new URL("dashboard.html", window.location.href);
                    successUrl.searchParams.set("status", "success");
                    successUrl.searchParams.set("salon", salonId);
                    successUrl.searchParams.set("order_id", orderId);

                    const failedUrl = new URL("subscription.html", window.location.href);
                    failedUrl.searchParams.set("salon", salonId);

                    const response = await fetch("https://pay.zapupi.com/api/create-order", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            zap_key: ZAPUPI_KEY,
                            order_id: orderId,
                            amount: currentAmount,
                            customer_mobile: salonId,
                            remark: currentPlanText,
                            success_url: successUrl.toString(),
                            failed_url: failedUrl.toString()
                        })
                    });

                    const data = await response.json();

                    if (data.status === "success" && data.payment_url) {
                        window.location.href = data.payment_url;
                    } else {
                        window.showCustomPopup("Payment Failed", data.message || "Please check API key.", "error");
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }
                } catch (error) {
                    console.error("ZapUPI Error:", error);
                    window.showCustomPopup("Network Error", "Could not connect to ZapUPI gateway.", "error");
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            }
        };

        window.showCustomPopup = function(title, message, type) {
            const modal = document.getElementById("customModal");
            const titleEl = document.getElementById("modalTitle");
            const msgEl = document.getElementById("modalMsg");
            const iconEl = document.getElementById("modalIcon");

            titleEl.innerText = title;
            msgEl.innerText = message;

            if (type === "success") {
                iconEl.className = "w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-3xl shadow-inner";
                iconEl.innerHTML = `<i class="fa-solid fa-circle-check"></i>`;
            } else {
                iconEl.className = "w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-3xl shadow-inner";
                iconEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i>`;
            }

            modal.classList.remove("hidden");
        };

        window.closeModalAndRedirect = function() {
            window.location.href = `dashboard.html?salon=${encodeURIComponent(salonId)}`;
        };
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 p-4 md:p-8">

    <div class="max-w-xl mx-auto space-y-6">

        <header class="bg-indigo-600 text-white p-6 rounded-3xl shadow-md flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="dashboard.html" class="bg-white/25 hover:bg-white/30 text-white p-2.5 rounded-xl transition"><i class="fa-solid fa-arrow-left text-sm"></i></a>
                <div>
                    <h1 class="text-xl font-bold">Subscription & Renewal</h1>
                    <p class="text-xs text-indigo-200 mt-0.5"><span id="activeSlugHeader">Syncing salon...</span></p>
                </div>
            </div>
            <a href="dashboard.html" class="bg-white text-indigo-700 px-4 py-2 rounded-xl text-xs font-bold shadow hover:bg-indigo-50 transition">Dashboard</a>
        </header>

        <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm text-center space-y-4">
            <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-xl shadow-inner">
                <i class="fa-solid fa-rotate"></i>
            </div>

            <div>
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Choose Renewal Plan</p>
                <h2 class="text-2xl font-black text-indigo-600">Select Software Package</h2>
                <p class="text-xs text-gray-500 mt-1">Paid plans will automatically add up to your remaining validity</p>
            </div>

            <div class="space-y-3 pt-2 text-left">
                <label class="block text-xs font-bold text-gray-700">Available Plans:</label>
                <div class="grid grid-cols-2 gap-3">

                    <label id="freeTrialCard" class="border-2 border-green-500 bg-green-50/50 p-3 rounded-2xl cursor-pointer flex flex-col justify-between transition plan-card" onclick="selectPlan(0, '7 Days Free Trial', 7, this)">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-green-700"><i class="fa-solid fa-star"></i> Free Trial</span>
                            <input type="radio" id="trialRadio" name="plan" class="text-green-600">
                        </div>
                        <p id="trialSubText" class="text-sm font-black text-green-600 mt-2">7 Days <span class="text-[10px] text-gray-500 font-normal">Free</span></p>
                    </label>

                    <label id="defaultPlanCard" class="border-2 border-gray-200 bg-white p-3 rounded-2xl cursor-pointer flex flex-col justify-between hover:border-indigo-300 transition plan-card" onclick="selectPlan(100, '1 Month Plan', 30, this)">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-gray-800">1 Month</span>
                            <input type="radio" name="plan" class="text-indigo-600">
                        </div>
                        <p class="text-sm font-black text-indigo-600 mt-2">₹100</p>
                    </label>

                    <label class="border-2 border-gray-200 bg-white p-3 rounded-2xl cursor-pointer flex flex-col justify-between hover:border-indigo-300 transition plan-card" onclick="selectPlan(250, '3 Months Plan', 90, this)">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-gray-800">3 Months</span>
                            <input type="radio" name="plan" class="text-indigo-600">
                        </div>
                        <p class="text-sm font-black text-indigo-600 mt-2">₹250 <span class="text-[10px] text-green-600 font-normal">Save ₹50</span></p>
                    </label>

                    <label class="border-2 border-gray-200 bg-white p-3 rounded-2xl cursor-pointer flex flex-col justify-between hover:border-indigo-300 transition plan-card" onclick="selectPlan(500, '6 Months Plan', 180, this)">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-gray-800">6 Months</span>
                            <input type="radio" name="plan" class="text-indigo-600">
                        </div>
                        <p class="text-sm font-black text-indigo-600 mt-2">₹500 <span class="text-[10px] text-green-600 font-normal">Save ₹100</span></p>
                    </label>

                    <label class="border-2 border-gray-200 bg-white p-3 rounded-2xl cursor-pointer flex flex-col justify-between hover:border-indigo-300 transition plan-card col-span-2" onclick="selectPlan(900, '1 Year Plan', 365, this)">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-gray-800">1 Year (Best Value)</span>
                            <input type="radio" name="plan" class="text-indigo-600">
                        </div>
                        <p class="text-sm font-black text-indigo-600 mt-2">₹900 <span class="text-[10px] text-green-600 font-normal">Save Big</span></p>
                    </label>

                </div>
            </div>

            <button onclick="handleAction()" id="proceedBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-green-100 flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-check"></i> Activate 7 Days Free Trial
            </button>
        </div>

    </div>

    <div id="customModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
            <div id="modalIcon" class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-3xl shadow-inner">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <div>
                <h3 id="modalTitle" class="text-xl font-black text-gray-900">Success!</h3>
                <p id="modalMsg" class="text-xs text-gray-500 mt-1">Action completed successfully.</p>
            </div>
            <button onclick="closeModalAndRedirect()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-indigo-100 cursor-pointer">
                Continue to Dashboard
            </button>
        </div>
    </div>
</body>
</html>
