<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Admin - Manage Password</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script type="module">
        import {
            onAuthStateChanged,
            EmailAuthProvider,
            reauthenticateWithCredential,
            updatePassword
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { auth, normalizeSalonId, getSalonDocRef } from "./tenant.js";

        let currentAdminUser = null;
        let activeSalonSlug = "";

        function showStatus(message, isError = false) {
            const box = document.getElementById("passwordStatusBox");
            box.innerText = message;
            box.className = isError
                ? "text-xs font-semibold p-3.5 rounded-xl bg-red-50 text-red-600 border border-red-200"
                : "text-xs font-semibold p-3.5 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200";
            box.classList.remove("hidden");
        }

        window.toggleVisibility = function(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input || !icon) return;
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        };

        document.getElementById("changePasswordForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const user = auth.currentUser || currentAdminUser;
            if (!user || !user.email) {
                showStatus("Firebase login session nahi mila. Kripya pehle index.html se login karein.", true);
                return;
            }

            const oldPassword = document.getElementById("oldPassword").value.trim();
            const newPassword = document.getElementById("newPassword").value.trim();
            const confirmPassword = document.getElementById("confirmPassword").value.trim();
            const btn = document.getElementById("updatePassBtn");

            if (!oldPassword || !newPassword || !confirmPassword) {
                showStatus("Old Password, New Password aur Confirm Password — sabhi bharna zaroori hai.", true);
                return;
            }
            if (newPassword.length < 6) {
                showStatus("Naya password kam se kam 6 characters ka hona chahiye (Firebase rule).", true);
                return;
            }
            if (newPassword !== confirmPassword) {
                showStatus("New Password aur Confirm Password match nahi kar rahe.", true);
                return;
            }
            if (oldPassword === newPassword) {
                showStatus("Naya password purane password se alag hona chahiye.", true);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Updating in Firebase...`;

            try {
                const credential = EmailAuthProvider.credential(user.email.trim().toLowerCase(), oldPassword);
                await reauthenticateWithCredential(user, credential);
                await updatePassword(user, newPassword);

                const slug = normalizeSalonId(
                    activeSalonSlug ||
                    new URLSearchParams(window.location.search).get("salon") ||
                    sessionStorage.getItem("activeSalonId") ||
                    ""
                );
                if (slug) {
                    await setDoc(getSalonDocRef(slug), {
                        passwordUpdatedAt: serverTimestamp()
                    }, { merge: true }).catch(() => {});
                }

                document.getElementById("changePasswordForm").reset();
                showStatus("Password successfully update ho gaya! Agli baar naye password se login karein.");
            } catch (error) {
                console.error("Firebase Password Update Error:", error);
                if (error.code === "auth/wrong-password" || error.code === "auth/invalid-credential") {
                    showStatus("Old Password galat hai! Sahi purana password dalein.", true);
                } else if (error.code === "auth/weak-password") {
                    showStatus("Password bahut weak hai. Kam se kam 6 characters ka strong password dalein.", true);
                } else if (error.code === "auth/too-many-requests") {
                    showStatus("Bahut zyada koshishein ki gayi hain. Thodi der baad try karein.", true);
                } else {
                    showStatus("Password update nahi ho paya: " + error.message, true);
                }
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-shield-halved mr-1.5"></i> Update Password`;
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.replace("index.html");
                return;
            }
            currentAdminUser = user;
            const params = new URLSearchParams(window.location.search);
            activeSalonSlug = normalizeSalonId(params.get("salon") || sessionStorage.getItem("activeSalonId") || "");

            const backBtn = document.getElementById("backToSettingsBtn");
            if (backBtn && activeSalonSlug) backBtn.href = `settings.html?salon=${encodeURIComponent(activeSalonSlug)}`;

            const dashBtn = document.getElementById("backToDashBtn");
            if (dashBtn && activeSalonSlug) dashBtn.href = `dashboard.html?salon=${encodeURIComponent(activeSalonSlug)}`;

            document.getElementById("adminAccountInfo").innerText = `Account: ${user.email}`;
        });
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 p-4 md:p-8">

    <div class="max-w-xl mx-auto space-y-6">

        <header class="bg-rose-600 text-white p-6 rounded-3xl shadow-md flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a id="backToSettingsBtn" href="settings.html" class="bg-white/20 hover:bg-white/30 text-white p-2.5 rounded-xl transition">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <div>
                    <h1 class="text-xl font-bold">Manage Password</h1>
                    <p id="adminAccountInfo" class="text-xs text-rose-100 mt-0.5">Syncing account...</p>
                </div>
            </div>
            <a id="backToDashBtn" href="dashboard.html" class="bg-white text-rose-700 px-4 py-2 rounded-xl text-xs font-bold shadow hover:bg-rose-50 transition">
                Dashboard
            </a>
        </header>

        <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm space-y-5">
            <div class="flex items-center gap-3 border-b border-gray-100 pb-3">
                <div class="w-10 h-10 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center text-base">
                    <i class="fa-solid fa-key"></i>
                </div>
                <div>
                    <h2 class="text-base font-bold text-gray-900">Change Admin Password</h2>
                    <p class="text-xs text-gray-400">Old password verify karke naya password set karein</p>
                </div>
            </div>

            <div id="passwordStatusBox" class="hidden"></div>

            <form id="changePasswordForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Old Password *</label>
                    <div class="relative">
                        <input type="password" id="oldPassword" required placeholder="Enter current / old password"
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:bg-white focus:ring-2 focus:ring-rose-500">
                        <button type="button" onclick="toggleVisibility('oldPassword', 'eyeOld')" class="absolute right-3.5 top-3 text-gray-400 hover:text-gray-600 cursor-pointer">
                            <i id="eyeOld" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">New Password * <span class="text-[10px] font-normal text-gray-400">(Min 6 characters)</span></label>
                    <div class="relative">
                        <input type="password" id="newPassword" required minlength="6" placeholder="Enter new password"
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:bg-white focus:ring-2 focus:ring-rose-500">
                        <button type="button" onclick="toggleVisibility('newPassword', 'eyeNew')" class="absolute right-3.5 top-3 text-gray-400 hover:text-gray-600 cursor-pointer">
                            <i id="eyeNew" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Confirm New Password *</label>
                    <div class="relative">
                        <input type="password" id="confirmPassword" required minlength="6" placeholder="Re-enter new password"
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:bg-white focus:ring-2 focus:ring-rose-500">
                        <button type="button" onclick="toggleVisibility('confirmPassword', 'eyeConfirm')" class="absolute right-3.5 top-3 text-gray-400 hover:text-gray-600 cursor-pointer">
                            <i id="eyeConfirm" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="updatePassBtn"
                    class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-rose-100 cursor-pointer">
                    <i class="fa-solid fa-shield-halved mr-1.5"></i> Update Password
                </button>
            </form>
        </div>

    </div>

</body>
</html>
