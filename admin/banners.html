<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Admin - Manage Banners & Sliders</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { addDoc, getDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { db, normalizeSalonId, getSalonDocRef, getSalonSubcollectionRef } from "./tenant.js";

        const auth = getAuth();
        let salonId = "";

        async function resolveSyncedSalonId(user) {
            const params = new URLSearchParams(window.location.search);
            let slug = normalizeSalonId(
                params.get("salon") ||
                sessionStorage.getItem("activeSalonId") ||
                localStorage.getItem("currentSalonSlug") ||
                localStorage.getItem("activeSalonId") ||
                ""
            );

            const emailKey = (user?.email || localStorage.getItem("adminEmail") || "").trim().toLowerCase();
            const emailSlug = normalizeSalonId(emailKey);

            if (emailSlug) {
                try {
                    const emailDoc = await getDoc(getSalonDocRef(emailSlug));
                    if (emailDoc.exists() && emailDoc.data()?.linkedSalonSlug) {
                        slug = normalizeSalonId(emailDoc.data().linkedSalonSlug) || slug;
                    }
                } catch (_) {}
            }

            if (!slug && emailSlug) slug = emailSlug;

            if (slug) {
                sessionStorage.setItem("activeSalonId", slug);
                localStorage.setItem("activeSalonId", slug);
                localStorage.setItem("currentSalonSlug", slug);
            }
            return slug;
        }

        function getBannersRef() {
            return getSalonSubcollectionRef(salonId, "banners");
        }

        document.getElementById("bannerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!salonId) return;
            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.innerText = "Publishing...";

            const bannerData = {
                tag: document.getElementById("bannerTag").value.trim(),
                title: document.getElementById("bannerTitle").value.trim(),
                subtitle: document.getElementById("bannerSubtitle").value.trim(),
                image: document.getElementById("bannerImage").value.trim(),
                bgColor: document.getElementById("bgColor1").value,
                bgColor2: document.getElementById("bgColor2").value,
                salonId,
                createdAt: new Date()
            };

            try {
                await addDoc(getBannersRef(), bannerData);
                document.getElementById("bannerForm").reset();
                loadBanners();
            } catch (err) {
                alert("Error adding banner: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Add Banner to Slider";
            }
        });

        async function loadBanners() {
            const container = document.getElementById("bannerList");
            container.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">Loading active banners...</p>`;

            try {
                const snapshot = await getDocs(getBannersRef());
                let html = "";
                snapshot.forEach((item) => {
                    const b = item.data();
                    const hasTag = Boolean(b.tag && String(b.tag).trim() !== "");
                    const hasTitle = Boolean(b.title && String(b.title).trim() !== "");
                    const hasSubtitle = Boolean(b.subtitle && String(b.subtitle).trim() !== "");
                    const hasAnyText = hasTag || hasTitle || hasSubtitle;

                    html += `
                        <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm flex flex-col justify-between gap-4">
                            <div class="h-32 rounded-2xl p-4 text-white flex items-center relative overflow-hidden" style="background: linear-gradient(135deg, ${b.bgColor || '#4f46e5'}, ${b.bgColor2 || '#9333ea'});">
                                ${b.image ? `<img src="${b.image}" class="absolute inset-0 w-full h-full object-cover object-center z-0" alt="Banner">` : ''}
                                ${hasAnyText ? `
                                    <div class="w-4/5 space-y-1 relative z-10">
                                        ${hasTag ? `<span class="inline-block bg-white/25 text-[9px] font-bold px-2 py-0.5 rounded-full uppercase">${b.tag}</span>` : ''}
                                        ${hasTitle ? `<h4 class="text-sm font-bold leading-tight">${b.title}</h4>` : ''}
                                        ${hasSubtitle ? `<p class="text-[10px] text-white/95 truncate">${b.subtitle}</p>` : ''}
                                    </div>
                                ` : ''}
                            </div>
                            
                            <button onclick="deleteBanner('${item.id}')" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 cursor-pointer">
                                <i class="fa-solid fa-trash"></i> Delete Banner
                            </button>
                        </div>
                    `;
                });
                container.innerHTML = html === "" ? `<p class="text-xs text-gray-400 col-span-2 text-center py-6">No banners added yet.</p>` : html;
            } catch (err) {
                container.innerHTML = `<p class="text-xs text-red-500 text-center">Failed to load banners.</p>`;
            }
        }

        window.deleteBanner = async function(id) {
            if (!salonId || !confirm("Are you sure you want to delete this banner?")) return;
            try {
                await deleteDoc(doc(db, "salons", salonId, "banners", id));
                loadBanners();
            } catch (err) {
                alert("Error deleting banner: " + err.message);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user && localStorage.getItem("isAdminLoggedIn") !== "true") {
                window.location.href = "index.html";
                return;
            }
            salonId = await resolveSyncedSalonId(user);
            if (!salonId) {
                window.location.href = "index.html";
                return;
            }
            document.getElementById("activeSlugHeader").innerText = `Salon: ${salonId}`;
            loadBanners();
        });
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <header class="bg-indigo-600 text-white p-6 rounded-3xl shadow-md flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="settings.html" class="bg-white/20 hover:bg-white/30 text-white p-2.5 rounded-xl transition"><i class="fa-solid fa-arrow-left text-sm"></i></a>
                <div>
                    <h1 class="text-xl font-bold">Manage Banners & Sliders</h1>
                    <p class="text-xs text-indigo-200 mt-0.5"><span id="activeSlugHeader">Syncing salon...</span></p>
                </div>
            </div>
            <a href="settings.html" class="bg-white text-indigo-700 px-4 py-2 rounded-xl text-xs font-bold shadow hover:bg-indigo-50 transition">Settings</a>
        </header>

        <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm">
            <h2 class="text-sm font-bold text-gray-900 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-indigo-600"></i> Add New Slider Banner
            </h2>
            <form id="bannerForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Offer Tag (Optional)</label>
                    <input type="text" id="bannerTag" placeholder="Optional - leave blank for image only" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Main Banner Title (Optional)</label>
                    <input type="text" id="bannerTitle" placeholder="Optional - leave blank for image only" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Subtitle / Description (Optional)</label>
                    <input type="text" id="bannerSubtitle" placeholder="Optional - leave blank for image only" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Banner Image URL (832×288 recommended)</label>
                    <input type="url" id="bannerImage" placeholder="https://..." required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex items-center gap-4">
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-gray-600 mb-1">Gradient Start Color</label>
                        <input type="color" id="bgColor1" value="#4f46e5" class="w-full h-10 rounded-xl cursor-pointer border border-gray-200">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-gray-600 mb-1">Gradient End Color</label>
                        <input type="color" id="bgColor2" value="#9333ea" class="w-full h-10 rounded-xl cursor-pointer border border-gray-200">
                    </div>
                </div>
                <div class="flex items-end">
                    <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-md text-xs cursor-pointer">
                        Add Banner to Slider
                    </button>
                </div>
            </form>
        </div>

        <div>
            <h3 class="text-sm font-bold text-gray-800 mb-3">Active Sliders on Your Salon Home Screen</h3>
            <div id="bannerList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

    </div>

</body>
</html>
