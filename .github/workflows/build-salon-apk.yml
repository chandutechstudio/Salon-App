- name: Ensure Android Gradle Plugin Repository
        working-directory: android-builder
        shell: bash
        run: |
          python3 - << 'EOF'
          import os

          settings_path = "settings.gradle"
          if not os.path.exists(settings_path):
              with open(settings_path, "w", encoding="utf-8") as f:
                  f.write("rootProject.name = 'android-builder'\ninclude ':app'\n")

          with open(settings_path, "r", encoding="utf-8") as f:
              s_content = f.read()

          if "pluginManagement" not in s_content:
              pm_lines = [
                  "pluginManagement {",
                  "    repositories {",
                  "        google()",
                  "        mavenCentral()",
                  "        gradlePluginPortal()",
                  "    }",
                  "    plugins {",
                  "        id 'com.android.application' version '8.3.2' apply false",
                  "    }",
                  "}",
                  "dependencyResolutionManagement {",
                  "    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)",
                  "    repositories {",
                  "        google()",
                  "        mavenCentral()",
                  "    }",
                  "}",
                  ""
              ]
              s_content = "\n".join(pm_lines) + "\n" + s_content
              with open(settings_path, "w", encoding="utf-8") as f:
                  f.write(s_content)

          root_gradle = "build.gradle"
          if not os.path.exists(root_gradle):
              rg_lines = [
                  "plugins {",
                  "    id 'com.android.application' version '8.3.2' apply false",
                  "}",
                  ""
              ]
              with open(root_gradle, "w", encoding="utf-8") as f:
                  f.write("\n".join(rg_lines))

          gp_path = "gradle.properties"
          gp_content = ""
          if os.path.exists(gp_path):
              with open(gp_path, "r", encoding="utf-8") as f:
                  gp_content = f.read()

          if "android.useAndroidX=true" not in gp_content:
              gp_content = gp_content.rstrip() + "\nandroid.useAndroidX=true\n"
          if "android.enableJetifier=true" not in gp_content:
              gp_content = gp_content.rstrip() + "\nandroid.enableJetifier=true\n"

          with open(gp_path, "w", encoding="utf-8") as f:
              f.write(gp_content.lstrip())
          EOF
